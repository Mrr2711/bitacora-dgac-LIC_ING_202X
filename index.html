<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#eceeee;
    --surface:#ffffff;
    --surface-2:#f4f5f5;
    --ink:#182028;
    --muted:#5b6770;
    --faint:#8a949c;
    --line:#d7dbdc;
    --accent:#c47c1f;
    --accent-ink:#3a2705;
    --good:#2f7d51;
    --good-bg:#e3f2e8;
    --bad:#b0402f;
    --bad-bg:#fbe7e3;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 1px 2px rgba(20,26,32,.06), 0 6px 20px -12px rgba(20,26,32,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10151b;
      --surface:#1a222a;
      --surface-2:#20293230;
      --surface-2:#212a33;
      --ink:#e7ebee;
      --muted:#9aa7b0;
      --faint:#69747c;
      --line:#2b3540;
      --accent:#e8a53a;
      --accent-ink:#241a04;
      --good:#5cba81;
      --good-bg:#173625;
      --bad:#e2735f;
      --bad-bg:#3a1f19;
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10151b;
    --surface:#1a222a;
    --surface-2:#212a33;
    --ink:#e7ebee;
    --muted:#9aa7b0;
    --faint:#69747c;
    --line:#2b3540;
    --accent:#e8a53a;
    --accent-ink:#241a04;
    --good:#5cba81;
    --good-bg:#173625;
    --bad:#e2735f;
    --bad-bg:#3a1f19;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 30px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  .mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  }
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-wrap:balance;margin:0;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    display:flex;align-items:flex-start;gap:12px;
  }
  .topbar .iconbtn{margin-top:1px;}
  .brand{
    display:flex;align-items:baseline;gap:8px;flex:1;min-width:0;
  }
  .brand .mark{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;letter-spacing:.02em;
  }
  .brand .mark .dot{color:var(--accent);}
  .brand .sub{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .iconbtn{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    width:38px;height:38px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;
  }
  .iconbtn:hover{border-color:var(--accent);}
  .iconbtn:focus-visible, button:focus-visible, [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- main scroll area ---------- */
  main{flex:1;padding:18px 18px 40px;display:flex;flex-direction:column;gap:22px;}

  /* ---------- home ---------- */
  .panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .hero-panel{padding:18px 18px 16px;}
  .hero-panel .eyebrow{margin-bottom:6px;}
  .hero-panel p{margin:8px 0 0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:52ch;}
  .stat-row{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:26px;line-height:1;}
  .stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace;}

  .section-label{
    display:flex;align-items:center;gap:10px;
  }
  .section-label .eyebrow{white-space:nowrap;}
  .section-label .rule{flex:1;height:1px;background:var(--line);}

  .tile-grid{display:flex;flex-direction:column;gap:10px;}
  .tile{
    position:relative;
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 14px;cursor:pointer;text-align:left;width:100%;color:inherit;
    box-shadow:var(--shadow);
    transition:border-color .15s ease, transform .15s ease;
  }
  .tile:hover{border-color:var(--accent);}
  .tile:active{transform:scale(.997);}
  .tile:disabled{opacity:.5;cursor:not-allowed;}
  .tile:disabled:hover{border-color:var(--line);}
  .tile .led{
    width:8px;height:8px;border-radius:50%;background:var(--faint);flex-shrink:0;
    box-shadow:0 0 0 3px var(--surface-2);
  }
  .tile.on .led{background:var(--good);}
  .tile.warn .led{background:var(--accent);}
  .tile-body{flex:1;min-width:0;}
  .tile-body h3{font-size:19px;}
  .tile-body .meta{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;margin-top:3px;}
  .tile-score{
    text-align:right;flex-shrink:0;font-family:'IBM Plex Mono',monospace;
  }
  .tile-score .pct{font-size:17px;font-weight:500;}
  .tile-score .pct.none{color:var(--faint);}
  .tile-score .cap{font-size:9.5px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;}
  .chev{color:var(--faint);flex-shrink:0;}

  .count-toggle{display:flex;gap:6px;margin-top:10px;}
  .count-toggle button{
    flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:var(--radius-sm);font-family:'IBM Plex Mono',monospace;font-size:12.5px;cursor:pointer;
  }
  .count-toggle button.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, var(--surface));}

  .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .chip{
    padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  .chip.active{border-color:var(--accent);color:var(--accent-ink);background:var(--accent);font-weight:600;}
  .field-label{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace;margin-top:14px;}

  .btn{
    appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;cursor:pointer;font-weight:500;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;}

  /* ---------- session screen ---------- */
  .progress-wrap{padding:0 18px;}
  .progress-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--accent);transition:width .25s ease;}
  .session-meta{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 18px 0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);
  }

  .qcard{padding:20px;}
  .qcard .tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .tag{
    font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;
    color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 9px;
  }
  .qcard h2{font-size:21px;line-height:1.32;font-weight:600;font-family:'Barlow',sans-serif;}
  .ref-line{
    margin-top:10px;font-size:12.5px;color:var(--muted);font-family:'IBM Plex Mono',monospace;
    border-left:2px solid var(--line);padding-left:9px;line-height:1.5;
  }

  .options{display:flex;flex-direction:column;gap:9px;margin-top:18px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);
    padding:12px 13px;cursor:pointer;text-align:left;width:100%;color:inherit;font-size:14.5px;line-height:1.42;
  }
  .opt .letter{
    font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:12.5px;
    width:22px;height:22px;border-radius:5px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);
    margin-top:1px;
  }
  .opt:hover{border-color:var(--accent);}
  .opt.correct{border-color:var(--good);background:var(--good-bg);}
  .opt.correct .letter{border-color:var(--good);color:var(--good);background:var(--surface);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .opt.wrong .letter{border-color:var(--bad);color:var(--bad);background:var(--surface);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:not(.correct):not(.wrong){opacity:.55;}

  .session-footer{padding:16px 18px 6px;display:flex;flex-direction:column;gap:10px;}

  /* ---------- result screen ---------- */
  .score-hero{padding:26px 20px;text-align:center;}
  .score-hero .big{
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:58px;line-height:1;
  }
  .score-hero .big.good{color:var(--good);}
  .score-hero .big.bad{color:var(--bad);}
  .score-hero .frac{font-family:'IBM Plex Mono',monospace;color:var(--muted);margin-top:6px;font-size:14px;}

  .breakdown{display:flex;flex-direction:column;gap:10px;padding:16px;}
  .bd-row{display:flex;align-items:center;gap:10px;}
  .bd-row .lbl{width:120px;flex-shrink:0;font-size:12.5px;color:var(--muted);}
  .bd-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .bd-fill{height:100%;background:var(--accent);}
  .bd-num{width:52px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);flex-shrink:0;}

  .missed-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .missed-item{background:var(--surface);padding:13px 15px;}
  .missed-item .mq{font-size:13.5px;line-height:1.4;margin-bottom:6px;}
  .missed-item .ma{font-size:12px;font-family:'IBM Plex Mono',monospace;color:var(--good);}
  .missed-item .mr{font-size:11.5px;color:var(--muted);margin-top:3px;}

  /* ---------- history ---------- */
  .hist-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .hist-row{background:var(--surface);padding:12px 15px;display:flex;align-items:center;gap:12px;}
  .hist-row .hd{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--faint);width:64px;flex-shrink:0;}
  .hist-row .hm{flex:1;min-width:0;}
  .hist-row .hm .t{font-size:13.5px;font-weight:500;}
  .hist-row .hm .s{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .hist-row .hs{font-family:'IBM Plex Mono',monospace;font-size:14px;flex-shrink:0;}

  .empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:13.5px;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important;}
  }

 DÉCADA DE 1970.","EN LOS TRES PRIMEROS AÑOS DE LA DÉCADA DE 1990."],"c":3,"r":"CIRCULAR OACI 253-AN/151, PÁGINA 3, PÁRRAFO 1.1."},{"id":"fh158","q":"¿QUÉ SUCEDIÓ CON LOS ACCIDENTES RELACIONADOS CON PROBLEMAS DE MANTENIMIENTO, EN EL SEGUNDO DECENIO DE 1980, COMPARADO CON LA PRIMERA MITAD DEL DECENIO?","o":["AUMENTARON EN UN 95%.","DISMINUYERON EN UN 65%.","AUMENTARON EN UN 65%.","PERMANECIERON IGUAL."],"c":2,"r":"CIRCULAR OACI 253-AN/151, PÁGINA 3, PÁRRAFO 1.1."},{"id":"fh159","q":"¿CUÁNTOS PROBLEMAS DE MANTENIMIENTO SE RELATAN QUE OCURRIERON EN LA PRIMERA MITAD DEL DECENIO DE 1980, RELACIONADOS CON ACCIDENTES E INCIDENTES?","o":["SIETE.","DIESISIETE.","CATORCE.","QUINCE."],"c":1,"r":"CIRCULAR OACI 253-AN/151, PÁGINA 3, PÁRRAFO 1.1."},{"id":"fh160","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN? \"ASPECTO QUE NO IMPLICA NECESARIAMENTE UN ERROR PERO QUE ATAÑE AL PERSONAL DE MANTENIMIENTO POR CUANTO SON LOS PRIMEROS RESPONSABLES DE RESOLVER ESAS DIFICULTADES TÉCNICAS EN LAS OPERACIONES DIARIAS\":","o":["PROBLEMA DE MANTENIMIENTO.","PROBLEMA OPERACIONAL.","PROBLEMA GERENCIAL.","PROBLEMA DE CAPACITACIÓN."],"c":0,"r":"CIRCULAR OACI 253-AN/151, PÁGINA 3, PÁRRAFO 1.1."}]},"reg":{"label":"Reglamentación Aeronáutica","items":[{"id":"reg1","q":"AL EFECTUAR LA INSPECCIÓN ANUAL DE UNA AERONAVE QUE ESTÁ DEFINIDA EN LA NORMA DAN 43, ENTRE LOS ÍTEMS QUE OBLIGATORIAMENTE DEBE CUMPLIR LA PERSONA QUE LA EFECTÚE SE ENCUENTRAN:","o":["TODOS LOS ÍTEMS DE LAS INSPECCIONES ESPECIFICADAS Y RECOMENDADAS POR EL FABRICANTE DE LA AERONAVE EN EL MANUAL DE MANTENIMIENTO PARA SER REALIZADAS ANUALMENTE Y/O CADA 100 HORAS DE VUELO.","TODOS LOS ÍTEMS DE LAS INSPECCIONES ESPECIFICADAS Y RECOMENDADAS EN LAS INSTRUCCIONES DE AERONAVEGABILIDAD CONTINUADA DE LAS ALTERACIONES MAYORES Y REPARACIONES MAYORES QUE TENGA INCORPORADAS LA AERONAVE.","TODOS LOS ÍTEMS DEL PUNTO 2., DEL APÉNDICE “A” DE LA NORMA DAN 43.","TODOS LOS ÍTEMS SEÑALADOS EN ALTERNATIVAS A, B Y C ANTERIORES."],"c":3,"r":"DAN 43, 43.111(b)(1)"},{"id":"reg2","q":"AL PRESENTAR UN FORMULARIO DGAC 08/2-6, ¿CUÁL DE ESTAS ACTIVIDADES NO CORRESPONDE AL PROCESO DE PRIMERA CERTIFICACIÓN DE AERONAVEGABILIDAD SOLICITADO?","o":["EN ESTA SOLICITUD SE DEBE INDICAR CLARAMENTE LA FECHA Y LUGAR EN QUE PONDRÁ A DISPOSICIÓN LA AERONAVE ANTE LA DGAC, PARA LAS COMPROBACIONES E INSPECCIONES NECESARIAS.","SERÁ RESPONSABILIDAD DEL SOLICITANTE PROPORCIONAR PERSONAL Y EQUIPO PARA QUE LOS INSPECTORES DGAC REALICEN DICHAS INSPECCIONES.","ESTA SOLICITUD DEBE SER PRESENTADA POR EL EXPLOTADOR (PROPIETARIO U OPERADOR) DE LA AERONAVE, O POR SU REPRESENTANTE LEGAL.","FINALIZADO EL PROCESO DE VERIFICACIÓN DE LOS ANTECEDENTES CONDUCENTES A LA RCA, EL OPERADOR ENTREGARÁ A LA DGAC LOS ARCHIVOS O PLANILLAS CON LA SITUACIÓN ACTUALIZADA DE LOS REGISTROS DE LA AERONAVEGABILIDAD CONTINUADA."],"c":3,"r":"DAN 21, Apéndice 2 (PCA); contraste con DAP 08 06"},{"id":"reg3","q":"¿A QUÉ AERONAVES ES APLICABLE LA NORMA DAN 43 QUE ESTABLECE LAS REGLAS QUE RIGEN LA REALIZACIÓN DE TRABAJOS DE MANTENIMIENTO?","o":["A TODA AERONAVE QUE VUELE EN CHILE.","A TODA AERONAVE QUE POSEA UN CERTIFICADO DE AERONAVEGABILIDAD ESTÁNDAR OTORGADO POR LA DGAC.","A TODA AERONAVE QUE POSEA UN CERTIFICADO DE MATRÍCULA CHILENO.","A TODA AERONAVE QUE ALGUIEN QUIERA MATRICULAR Y OPERAR EN CHILE."],"c":1,"r":"DAN 43, 43.003"},{"id":"reg4","q":"¿A QUÉ CONCEPTO O TÉRMINO CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"TODA OTRA BASE DECLARADA POR LA EMPRESA, AUTORIZADA POR LA DGAC Y QUE SE ENCUENTRA EN LUGAR DISTINTO A LA BASE PRINCIPAL DE OPERACIONES\".","o":["BASE DE ALTERNATIVA DE OPERACIONES.","BASE AUXILIAR DE OPERACIONES.","BASE SECUNDARIA DE OPERACIONES.","BASE DE DESPLIEGUE DE LAS OPERACIONES."],"c":2,"r":"DAN 119, definiciones"},{"id":"reg5","q":"¿A QUÉ CONCEPTO O TÉRMINO CORRESPONDE LO SIGUIENTE?: \"QUE ES USADO O ESTÁ PENSADO PARA SER USADO EN LA OPERACIÓN O EN EL CONTROL DE UNA AERONAVE EN VUELO, QUE ES INSTALADO DENTRO DE UNA AERONAVE O UNIDO A ELLA, Y QUE NO ES PARTE DE LA CÉLULA, MOTOR O HÉLICE\".","o":["ACCESORIO.","COMPONENTE (APPLIANCE).","COMPONENTE (NO APPLIANCE).","REPUESTO."],"c":1,"r":"DAN 43, 43.001"},{"id":"reg6","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"CONDICIÓN DE UNA AERONAVE, MOTOR O HÉLICE CUANDO SE ENCUENTRA CONFORME A SU CERTIFICADO DE TIPO Y EN CONDICIÓN DE OPERACIÓN SEGURA. CONDICIÓN DE UNA PARTE, DE UN COMPONENTE O DE UN SISTEMA DE AERONAVE, CUANDO SE ENCUENTRA CONFORME A SU DISEÑO APROBADO Y EN CONDICIÓN DE OPERACIÓN SEGURA\".","o":["CONDICIÓN DE OPERACIÓN SEGURA.","CONDICIÓN DE MANTENIMIENTO AL DÍA.","CONDICIÓN AERONAVEGABLE.","CONDICIÓN DE INSPECCIÓN."],"c":2,"r":"DAN 43, 43.001"},{"id":"reg7","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"ES EL ACTO DE EXAMINAR UNA AERONAVE, MOTOR. HÉLICE O PARTES DE ELLOS, PARA ESTABLECER QUE ESTÁN CONFORMES A SUS ESPECIFICACIONES Y/O EN BUENAS CONDICIONES DE UTILIZACIÓN, O QUE UN TRABAJO DE MANTENIMIENTO EFECTUADO EN ESTOS ESTÁ CONFORME A LOS DATOS DE MANTENIMIENTO APLICABLES Y PRÁCTICAS ACEPTABLES\".","o":["CONFORMIDAD.","MANTENIMIENTO.","CONFORMIDAD DE MANTENIMIENTO.","INSPECCIÓN."],"c":3,"r":"DAN 43, 43.001"},{"id":"reg8","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"INSPECCIÓN DE LA AERONAVE COMPLETA, DIVIDIDA EN PORCIONES REPARTIDAS DENTRO DE CADA PERÍODO DE DOCE MESES CALENDARIO, Y QUE ES COMPATIBLE CON LAS RECOMENDACIONES DEL FABRICANTE, EXPERIENCIA DE SERVICIO Y CON EL TIPO DE OPERACIÓN EN LA QUE SE EMPLEA LA AERONAVE\".","o":["INSPECCIÓN PROGRESIVA.","INSPECCIÓN CALENDARIA.","INSPECCIÓN ANUAL.","INSPECCIÓN DIVIDIDA."],"c":0,"r":"DAN 43, 43.001"},{"id":"reg9","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"INSPECCIÓN QUE ABARCA A LA AERONAVE COMPLETA Y A SUS REGISTROS DE MANTENIMIENTO, CON EL NIVEL DE DETALLE QUE ESTABLECE LA NORMA DAN 43, Y CUYO PROPÓSITO ES VERIFICAR QUE TAL AERONAVE SE ENCUENTRA AERONAVEGABLE O DETALLAR LAS DISCREPANCIAS QUE IMPIDEN CALIFICARLA COMO AERONAVEGABLE\".","o":["INSPECCIÓN PROGRESIVA.","INSPECCIÓN CALENDARIA.","INSPECCIÓN ANUAL.","INSPECCIÓN DIVIDIDA."],"c":2,"r":"DAN 43, 43.001"},{"id":"reg10","q":"¿A QUÉ CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"RESPECTO DE UNA PARTE CON VIDA LIMITADA, LO QUE HAYA ACUMULADO EN CUANTO A CICLOS, HORAS, TIEMPO CALENDARIO O CUALQUIER OTRO PARÁMETRO\".","o":["ELEMENTO DE VIDA LIMITADA.","ESTATUS DE VIDA.","ELEMENTO HARD TIME.","PARTE NO REPARABLE."],"c":1,"r":"DAN 43, 43.001"},{"id":"reg11","q":"¿A QUÉ CORRESPONDE LO SIGUIENTE?: \"MANUALES DE MANTENIMIENTO, CATÁLOGO DE PARTES ILUSTRADO, BOLETINES DE SERVICIO, CARTAS DE SERVICIO\".","o":["A DATOS DE CONFIABILIDAD.","A DATOS DE LA AERONAVE.","A DATOS DEL CMA.","A DATOS DE MANTENIMIENTO."],"c":3,"r":"DAN 145, 145.117"},{"id":"reg12","q":"¿A QUÉ DEFINICIÓN CORRESPONDE LO SIGUIENTE?: \"RESTAURACIÓN DE UNA AERONAVE, MOTOR, HÉLICE O PIEZA CONEXA A SU CONDICIÓN AERONAVEGABLE O AL MENOS A UNA CONDICIÓN DE OPERACIÓN SEGURA, DE CONFORMIDAD CON LOS DATOS TÉCNICOS DE MANTENIMIENTO APLICABLES, CUANDO HAYA SUFRIDO DAÑOS O DESGASTE POR EL USO\".","o":["RESTAURACIÓN.","REPARACIÓN.","RECONSTRUCCIÓN.","REPOSICIÓN."],"c":1,"r":"DAN 43, 43.001"},{"id":"reg13","q":"¿A QUÉ PROCESO SE DEBE SOMETER A LOS ELEMENTOS DECLARADOS DEFINITIVAMENTE NO APTOS PARA EL SERVICIO?","o":["A UN PROCESO DE ADAPTACIÓN.","A UN PROCESO DE MUTILACIÓN.","A UN PROCESO DE FUNDICIÓN.","A UN PROCESO DE RECUPERACIÓN."],"c":1,"r":"DAN 145, 145.103"},{"id":"reg14","q":"¿A QUÉ TÉRMINO O CONCEPTO CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"CERTIFICACIÓN DE QUE LOS TRABAJOS DE MANTENIMIENTO A LOS QUE SE REFIERE HAN SIDO CONCLUIDOS MANERA SATISFACTORIA, DE CONFORMIDAD CON DATOS DE MANTENIMIENTO APLICABLES Y QUE, EN CUANTO A DICHOS TRABAJOS, LA AERONAVE, MOTOR HÉLICE O COMPONENTE EN EL CUAL SE HAN EFECTUADO, ESTÁ APROBADO PARA RETORNAR AL SERVICIO\"","o":["CONDICIÓN DE OPERACIÓN SEGURA.","REGISTRO DE MANTENIMIENTO.","RETORNO AL SERVICIO.","CONFORMIDAD DE MANTENIMIENTO."],"c":3,"r":"DAN 43, 43.001"},{"id":"reg15","q":"¿A QUÉ TÉRMINO O CONCEPTO CORRESPONDE LA SIGUIENTE DEFINICIÓN?: \"CONDICIÓN EN QUE SE ENCUENTRA UNA AERONAVE O PARTE DE ÉSTA, SI NO SE LE OBSERVA DESGASTE O DETERIORO MÁS ALLÁ DE LÍMITES ACEPTABLES O NORMALES, NI DAÑO U OTRA ANORMALIDAD EVIDENTE\".","o":["CONDICIÓN DE OPERACIÓN SEGURA.","CONDICIÓN AERONAVEGABLE.","CERTIFICACIÓN DE MANTENIMIENTO.","CERTIFICACIÓN DE OPERATIBILIDAD."],"c":0,"r":"DAN 43, 43.001"},{"id":"reg16","q":"¿A QUIÉNES DEBE INFORMAR UN CMA DAN 145, CUANDO EMITE UN INFORME DE DIFICULTADES EN SERVICIO?","o":["AL PROPIETARIO DE LA AERONAVE Y AL RESPONSABLE DEL DISEÑO DE TIPO.","A LA FAA, AL PROPIETARIO DE LA AERONAVE Y AL RESPONSABLE DEL DISEÑO DE TIPO.","A LA EASA, AL PROPIETARIO DE LA AERONAVE Y AL RESPONSABLE DEL DISEÑO DE TIPO.","A LA DGAC, AL PROPIETARIO DE LA AERONAVE Y AL RESPONSABLE DEL DISEÑO DE TIPO."],"c":3,"r":"DAN 145, 145.209"},{"id":"reg17","q":"¿A QUIÉN SE OTORGARÁ UN CERTIFICADO DE APROBACIÓN DE CMA DAN 145?","o":["A QUIEN APRUEBE PRUEBAS TEÓRICAS Y PRÁCTICAS.","A QUIEN CUMPLA LOS REQUISITOS DE LA NORMA DAN 145.","A UN INGENIERO AERONÁUTICO.","A UN GERENTE DE MANTENIMIENTO."],"c":1,"r":"DAN 145, 145.005"},{"id":"reg18","q":"¿A TRAVÉS DE QUÉ PUEDE UNA OMA EMITIR UNA CONFORMIDAD DE MANTENIMIENTO?","o":["A TRAVÉS DE LA DGAC.","A TRAVÉS DEL GERENTE DE LA OMA.","A TRAVÉS DE PERSONAL CALIFICADO.","A TRAVÉS DE LA OFICINA DE CALIDAD."],"c":2,"r":"DAN 43, 43.203"},{"id":"reg19","q":"¿CÓMO PUEDE DESEMPEÑARSE UNA PERSONA QUE TENGA NIVEL 1 EN INSPECCIONES NO DESTRUCTIVAS?","o":["PUEDE EFECTUAR TRABAJOS EN LOS MÉTODOS QUE ESTÉ CAPACITADO.","PUEDE EFECTUAR TRABAJOS Y CERTIFICACIONES.","PUEDE CERTIFICAR SUS TRABAJOS.","SOLAMENTE COMO AYUDANTE O TRABAJAR BAJO SUPERVISIÓN."],"c":3,"r":"DAN 43, 43.113(b)(3)"},{"id":"reg20","q":"¿CÓMO PUEDE REALIZAR TRABAJOS DE MANTENIMIENTO EL TITULAR DE UNA LICENCIA DE MECÁNICO?","o":["COMO INTEGRANTE DE UNA EMPRESA AÉREA.","COMO INTEGRANTE DE UN CLUB AÉREO.","EN FORMA PARTICULAR.","COMO INTEGRANTE DE UNA OMA."],"c":3,"r":"DAN 43, 43.101"},{"id":"reg21","q":"COMO REGLA GENERAL PARA LA EJECUCIÓN DE MANTENIMIENTO EN UNA AERONAVE O PARTE DE ESTA, ¿QUÉ DEBEN CUMPLIR LOS MATERIALES QUE SE UTILICEN?","o":["QUE NO AFECTEN LA AERONAVEGABILIDAD DE LA AERONAVE O PARTE.","QUE SEAN LOS ESPECIFICADOS EN EL MANUAL DE MANTENIMIENTO O EN EL CATÁLOGO DE PARTES.","QUE, SI SON DIFERENTES A LOS ORIGINALES, LA AERONAVE O PARTE DEBE QUEDAR APROPIADAMENTE ALTERADA.","SON CORRECTAS A Y C"],"c":3,"r":"DAN 43, 43.105(a)(4)"},{"id":"reg22","q":"¿CÓMO SE CONSIDERA LA ADVISORY CIRCULAR 43.13-1B PARA EFECTUAR MANTENIMIENTO?","o":["COMO ASESORÍA AL MANTENIMIENTO.","COMO DATO DE MANTENIMIENTO ACEPTABLE.","COMO PUBLICACIÓN DE CONOCIMIENTOS GENERALES DE MANTENIMIENTO.","NO APLICA PARA AERONAVES DE MATRÍCULA CHILENA."],"c":1,"r":"DAN 43, 43.001, Datos aceptables"},{"id":"reg23","q":"¿CONTRA QUÉ DEBE ASEGURAR PROTECCIÓN DE SUS INSTALACIONES UN CMA DAN 145?","o":["CONTRA LOS FENÓMENOS DEL MEDIO AMBIENTE.","CONTRA INCENDIOS Y ROBOS O HURTOS.","CONTRA PERDIDAS DE HERRAMIENTAS Y EQUIPOS.","CONTRA TODOS LOS CASOS ANTERIORES."],"c":3,"r":"DAN 145, 145.101"},{"id":"reg24","q":"¿CUÁL DE LOS SIGUIENTES ES UN REQUISITO PARA QUE UN CMA DAN 145 PUEDA ESTAR CERTIFICADO PARA EFECTUAR MANTENIMIENTO DE UNA AERONAVE, CON HABILITACIÓN “ESTRUCTURA DE AERONAVE” Y NO LIMITADO A SÓLO MANTENIMIENTO DE LÍNEA?","o":["CONTAR CON UN EDIFICIO O LOCAL ADECUADO, PARA ACOMODAR COMPLETAMENTE LA AERONAVE EN CASO DE EMERGENCIA O MAL TIEMPO.","CONTAR CON UN EDIFICIO O LOCAL ADECUADO, PARA ACOMODAR COMPLETAMENTE LA AERONAVE Y EN FORMA PERMANENTE MIENTRAS DUREN LOS TRABAJOS.","CONTAR CON UN EDIFICIO O LOCAL ADECUADO, PARA ACOMODAR COMPLETAMENTE HASTA DOS AERONAVES.","CONTAR CON UN EDIFICIO O LOCAL ADECUADO, PARA ACOMODAR, A LO MENOS, LOS MOTORES DE LA AERONAVE."],"c":1,"r":"DAN 145, 145.105"},{"id":"reg25","q":"¿CUÁLES DE LAS SIGUIENTES NORMAS DE OPERACIÓN DE AERONAVES CONSIDERAN A LA INSPECCIÓN ANUAL ESTABLECIDA EN LA NORMA DAN 43 COMO UNA ALTERNATIVA A UN PROGRAMA DE MANTENIMIENTO APROBADO POR LA DGAC?","o":["LA DAN 92, VOLUMEN I.","LA DAN 92, VOLUMEN II (PARA TODA AERONAVE QUE OPERE BAJO DICHA NORMA).","LA DAN 92, VOLUMEN III (SÓLO EN CUANTO A HELICÓPTEROS CON MOTOR CONVENCIONAL).","LAS ALTERNATIVAS ANTERIORES A Y C SON CORRECTAS."],"c":3,"r":"DAN 92 Vol. I, 92.603; DAN 92 Vol. III (citado por el banco)"},{"id":"reg26","q":"¿CUÁL O CUÁLES DE LOS SIGUIENTES REQUISITOS SE DEBEN CUMPLIR PARA QUE UNA OMA EMITA UNA CONFORMIDAD DE MANTENIMIENTO?:","o":["QUE LOS TRABAJOS DE MANTENIMIENTO A LOS QUE SE REFIERA LA CONFORMIDAD HAYAN SIDO REALIZADOS SATISFACTORIAMENTE DE ACUERDO A DATOS DE MANTENIMIENTO APLICABLES Y A LOS PROCEDIMIENTOS DE LA OMA.","QUE LOS TRABAJOS DE MANTENIMIENTO A LOS QUE SE REFIERA LA CONFORMIDAD HAYAN SIDO REALIZADOS SATISFACTORIAMENTE DE ACUERDO AL MANUAL DE MANTENIMIENTO DE LA AERONAVE.","QUE SE HAYAN EFECTUADO PRUEBAS FUNCIONALES APROPIADAS DE LA AERONAVE EN TIERRA.","SE DEBEN CUMPLIR LOS REQUISITOS SEÑALADOS EN LAS TRES ALTERNATIVAS ANTERIORES."],"c":0,"r":"DAN 43, 43.201"},{"id":"reg27","q":"CUANDO LOS INSPECTORES DE LA DGAC (INSPECTORES DE AERONAVEGABILIDAD), REALIZAN UNA FISCALIZACIÓN TÉCNICA A UNA AERONAVE, COMUNICAN SUS HALLAZGOS O DISCREPANCIAS MEDIANTE EL FORM. DGAC 08/2-10, “INFORME DE INSPECCIÓN DE AERONAVE”. ENTONCES, EL PROPIETARIO O EXPLOTADOR DE LA AERONAVE, DEBE TOMAR CONOCIMIENTO Y RESPONDER DICHO INFORME CUMPLIENDO LO ESTABLECIDO EN EL:","o":["DAP 08 01.","DAP 08 05.","DAP 08 06.","DAP 08 25."],"c":0,"r":"DAP 08 01 (no adjunto)"},{"id":"reg28","q":"CUANDO LOS INSPECTORES DE LA DGAC (INSPECTORES DE AERONAVEGABILIDAD), REALIZAN UNA FISCALIZACIÓN TÉCNICA A UN CENTRO DE MANTENIMIENTO O A UNA EMPRESA AÉREA, COMUNICAN SUS OBSERVACIONES MEDIANTE EL FORM. DGAC 08/2-11. ENTONCES, EL CENTRO DE MANTENIMIENTO O LA EMPRESA AÉREA DEBE TOMAR CONOCIMIENTO Y RESPONDER DICHO INFORME CUMPLIENDO LO ESTABLECIDO EN EL:","o":["DAP 08 01.","DAP 08 05.","DAP 08 06.","DAP 08 25."],"c":1,"r":"DAP 08 05 (no adjunto)"},{"id":"reg29","q":"CUANDO SE REFIEREN A TRABAJOS DE MANTENIMIENTO ESPECÍFICOS, SON TÉRMINOS SINÓNIMOS “CONFORMIDAD DE MANTENIMIENTO” Y:","o":["APROBACIÓN DE MANTENIMIENTO.","RETORNO AL SERVICIO.","CONDICIÓN DE MANTENIMIENTO.","APROBACIÓN PARA RETORNO AL SERVICIO."],"c":3,"r":"DAN 43, 43.001"},{"id":"reg30","q":"¿CUÁNTAS SON LAS FASES DEL PROCESO DE CERTIFICACIÓN TÉCNICA PARA OBTENER UN CERTIFICADO DE OPERADOR AÉREO (AOC)?","o":["CINCO FASES.","CUATRO FASES.","TRES FASES.","DOS FASES."],"c":0,"r":"DAN 119, 119.011"},{"id":"reg31","q":"¿CUÁNTO TIEMPO DEBERÁ UN CERTIFICADOR HABER EJERCIDO LAS FACULTADES DE SU AUTORIZACIÓN ANTES QUE EL CMA RENUEVE LA AUTORIZACIÓN DE CERTIFICACIÓN?","o":["DOCE MESES EN LOS ÚLTIMOS DOS AÑOS.","SEIS MESES EN LOS ÚLTIMOS VEINTICUATRO MESES.","SOLO NECESITA ESTAR CONTRATADO EN EL CMA DAN 145.","DURANTE TODA LA VIGENCIA DE LA ÚLTIMA CERTIFICACIÓN."],"c":1,"r":"DAN 145, 145.107(d)(3)"},{"id":"reg32","q":"DE ACUERDO A LA NORMA DAN 21, LOS CERTIFICADOS DE AERONAVEGABILIDAD ESPECIALES, EXCEPTO LOS PERMISOS ESPECIALES DE VUELO, TENDRÁN UNA VIGENCIA:","o":["DE HASTA 12 MESES.","DE HASTA 2 AÑOS.","DE HASTA 9 AÑOS.","INDEFINIDA."],"c":2,"r":"DAN 21, 21.413(b)"},{"id":"reg33","q":"DE ACUERDO A LA NORMA DAN 43, PARA REGISTRAR UNA ALTERACIÓN MAYOR DE UNA AERONAVE QUE POSEA CERTIFICADO DE AERONAVEGABILIDAD ESTÁNDAR SE DEBE COMPLETAR Y DISTRIBUIR UN FORMULARIO DGAC 337 EN TRIPLICADO. LA DISTRIBUCIÓN DE FORMULARIOS DGAC 337 DEBE SER:","o":["EFECTUADA EN CUANTO LOS TRABAJOS DE ALTERACIÓN MAYOR SE TERMINEN, REGISTREN Y CERTIFIQUEN.","EFECTUADA EN UN PLAZO DE DOS DÍAS HÁBILES DESPUÉS DE TERMINADOS, REGISTRADOS Y CERTIFICADOS LOS TRABAJOS.","UN EJEMPLAR ORIGINAL PARA LA BITÁCORA DE MANTENIMIENTO DE LA AERONAVE QUE SE HAYA SOMETIDO A LA ALTERACIÓN; UN EJEMPLAR ORIGINAL PARA LA BITÁCORA DE VUELO DE LA MISMA AERONAVE; Y UN EJEMPLAR ORIGINAL PARA LA DGAC. ADICIONALMENTE, LAS OMA LIDER Y DEMÁS PARTICIPANTES EN LOS TRABAJOS DEBEN QUEDARSE CON COPIA DEL FORMULARIO.","UN EJEMPLAR ORIGINAL PARA EL EXPLOTADOR DE LA AERONAVE QUE SE HAYA SOMETIDO A LA ALTERACIÓN; UN EJEMPLAR ORIGINAL PARA LA OMA QUE HAYA LIDERADO O EFECTUADO AUTÓNOMAMENTE LOS TRABAJOS DE ALTERACIÓN; Y UN EJEMPLAR ORIGINAL PARA LA DGAC. ADICIONALMENTE, LAS DEMÁS OMA PARTICIPANTES EN LOS TRABAJOS DEBEN QUEDARSE CON COPIA DEL FORMULARIO."],"c":3,"r":"DAN 43, 43.303"},{"id":"reg34","q":"DE ACUERDO A LO QUE ESTABLECE LA NORMA DAN 21, APÉNDICE 2, PARA LA PRESENTACIÓN DEL PLAN DE REEMPLAZOS, EL SOLICITANTE DEBERÁ PRESENTAR ENTRE OTROS ANTECEDENTES:","o":["PROGRAMA DE CUMPLIMIENTO DE LAS INSPECCIONES ADICIONALES AL PROGRAMA DE MANTENIMIENTO QUE SE AUTORICE, DERIVADAS DE: INSPECCIONES POR CUMPLIMIENTO DE UNA MODIFICACIÓN O INSPECCIÓN MANDATARIA.","EL PLAN DE REEMPLAZOS AUTORIZADO POR LA AUTORIDAD AERONÁUTICA DEL ESTADO DE MATRÍCULA ANTERIOR Y LA DOCUMENTACIÓN DE RESPALDO DEBE SER PRESENTADO EN UNA FORMA ACEPTABLE PARA LA DGAC.","EL ESTADO DE LOS COMPONENTES DEBE INDICAR LAS HORAS/CICLOS/TIEMPO DE FUNCIONAMIENTO DESDE NUEVO O DESDE LA ÚLTIMA REVISIÓN GENERAL (OVERHAUL).","ALTERNATIVAS ANTERIORES B Y C SON CORRECTAS."],"c":3,"r":"DAN 21, Apéndice 2"},{"id":"reg35","q":"DESPUÉS DE REALIZADOS LOS TRABAJOS DE ALTERACIÓN MAYOR DE UNA AERONAVE, SE REQUIERE QUE LA OMA ENTREGUE CIERTOS DOCUMENTOS AL EXPLOTADOR DE LA AERONAVE PARA CONSERVACIÓN POR PARTE DE ÉSTE Y APLICACIÓN CUANDO CORRESPONDA. ¿CUÁL DE LOS SIGUIENTES NO SE REQUIERE?:","o":["LAS INSTRUCCIONES O MANUALES DE INSTALACIÓN.","LA ORDEN DE TRABAJO DE LA OMA.","LAS INSTRUCCIONES DE AERONAVEGABILIDAD CONTINUADA.","SUPLEMENTOS DE MANUALES."],"c":2,"r":"DAN 43, 43.301"},{"id":"reg36","q":"¿DÓNDE DEBE ESTAR ESTABLECIDO EL ALCANCE Y LIMITACIONES DE LOS TRABAJOS QUE CUBRE LA APROBACIÓN DEL CERTIFICADO DE CMA DAN 145?","o":["EN LA LISTA DE CAPACIDAD.","EN EL CERTIFICADO DE CMA DAN 145.","EN EL MANUAL DE MANTENIMIENTO DE LAS AERONAVES.","EN EL MPM."],"c":0,"r":"DAN 145, 145.007 y 145.017"},{"id":"reg37","q":"¿DÓNDE DEBE SER REGISTRADA LA CONFORMIDAD DE MANTE "},{"id":"reg60","q":"LOS REQUISITOS PARA QUE UNA AERONAVE DEPORTIVA LIVIANA (LSA) SEA ELEGIBLE PARA UN CERTIFICADO DE AERONAVEGABILIDAD OTORGADO POR LA DGAC, ESTÁN ESTABLECIDOS EN:","o":["LA DAN 21.","EL DAP 08 06.","LA DAN 137.","LA DAN 50."],"c":0,"r":"DAN 21, 21.421/LSA"},{"id":"reg61","q":"¿MEDIANTE QUÉ FORMULARIO DEBE ACREDITAR QUE UNA PARTE RETIRADA DE UNA AERONAVE ACCIDENTADA ESTÁ AERONAVEGABLE?","o":["DGAC 4528-3.","DGAC 8130-3.","FAA 8130-3.","DGAC 8130-5."],"c":1,"r":"DAN 43, 43.107"},{"id":"reg62","q":"NO TODOS LOS ÍTEMS DE LA INSPECCIÓN ANUAL O DE 100 HORAS ESPECIFICADA EN EL MANUAL DE MANTENIMIENTO SON OBLIGATORIOS CUANDO SE TRATA DE CUMPLIR CON LA INSPECCIÓN ANUAL DE UNA AERONAVE QUE ESTÁ DEFINIDA EN LA NORMA DAN 43, YA QUE ALGUNOS SE PUEDEN OMITIR (NO REALIZARSE), PERO SIEMPRE QUE ELLO SEA INDICADO POR ESCRITO POR EL EXPLOTADOR DE LA AERONAVE Y QUE NO SE DEJE DE CUMPLIR UN REQUISITO DE AERONAVEGABILIDAD. ASÍ, POR EJEMPLO, SE PUEDE OMITIR:","o":["CUALQUIER ÍTEM QUE PARA CUMPLIRLO DE ACUERDO AL MANUAL SEA NECESARIO DESMONTAR Y/O DESARMAR UNA PIEZA O PARTE.","REEMPLAZAR UNA PARTE DEBIDO SÓLO A QUE HAYA CUMPLIDO LAS HORAS O TIEMPO CALENDARIO RECOMENDADO PARA SU REEMPLAZO.","EFECTUAR UNA PRUEBA FUNCIONAL O CHEQUEO OPERACIONAL QUE NO REQUIERA DESMONTAR ALGUNA PIEZA O PARTE.","SON CORRECTOS LOS EJEMPLOS DADOS EN ALTERNATIVAS A, B Y C ANTERIORES."],"c":1,"r":"DAN 43, 43.111(b)(1)(iii)"},{"id":"reg63","q":"PARA AQUELLA AERONAVE QUE NO SE LE HA RENOVADO SU CERTIFICADO DE AERONAVEGABILIDAD DURANTE LOS ÚLTIMOS 5 AÑOS, ¿QUÉ ACTIVIDAD SE DEBE REALIZAR PARA VOLVER A VOLARLA?","o":["EL OPERADOR DEBERÁ EFECTUAR UN VUELO DE MANTENIMIENTO DE SU RESPONSABILIDAD Y SEGUIR EL PROCEDIMIENTO DE RCA.","LE CORRESPONDE LA APLICACIÓN DEL PROCESO DE PRIMERA CERTIFICACIÓN DE AERONAVEGABILIDAD Y NO EL DE RCA.","LE CORRESPONDE LA APLICACIÓN DEL PROCESO COMPLETO DE RCA.","SOLO A Y C SON CORRECTAS."],"c":1,"r":"DAP 08 06, 6.2.2(b)(2)"},{"id":"reg64","q":"PARA OBTENER ADICIONALMENTE UN  DAN 21","EL APÉNDICE 10 DE LA DAN 121"],"c":2,"r":"DAN 21, Apéndice 10; DAP 08 06, Preámbulo C"},{"id":"reg69","q":"PARA SOLICITAR LA RCA PARA UNA AERONAVE CERTIFICADA DE TIPO QUE ES OPERADA BAJO LA DAN 137 DEBE ADJUNTARSE UN CERTIFICADO DE CONDICIÓN DE AERONAVEGABILIDAD FIRMADO POR EL TITULAR DEL AOC Y POR LA PERSONA CON LICENCIA ENCARGADA DEL CONTROL DE MANTENIMIENTO DE LA AERONAVE. LOS FIRMANTES DE ESTE CERTIFICADO LO HARÁN BASÁNDOSE EN QUE SE HAYAN EFECTUADO PREVIAMENTE LAS SIGUIENTES TAREAS EN LA AERONAVE:","o":["UNA REVISIÓN DE LOS REGISTROS DE LA AERONAVEGABILIDAD CONTINUADA DE ACUERDO A LO ESTABLECIDO EN LA NORMA DE OPERACIÓN CORRESPONDIENTE.","UNA INSPECCIÓN FÍSICA DE LA AERONAVE PARA DETERMINAR QUE SE ENCUENTRA EN CONDICIÓN SEGURA.","PRUEBAS FUNCIONALES DE SISTEMAS Y EQUIPOS EN TIERRA.","TODAS LAS ACCIONES ANTERIORES."],"c":3,"r":"DAP 08 06, 2.2.3"},{"id":"reg70","q":"¿POR CUÁNTO TIEMPO SE DEBE MANTENER EL REGISTRO DE AUTO EVALUACIÓN DEL CMA?","o":["POR TRES AÑOS.","POR UN AÑO.","POR DOS AÑOS.","POR TODO EL TIEMPO QUE MANTENGA LA VIGENCIA EL CERTIFICADO DEL CMA DAN 145."],"c":2,"r":"DAN 145, 145.017(j)"},{"id":"reg71","q":"¿QUÉ CARGO DEBE TENER EL RESPONSABLE DEL MANTENIMIENTO?","o":["REPRESENTANTE LEGAL.","DIRECTIVO RESPONSABLE.","GERENTE DE MANTENIMIENTO.","GERENTE GENERAL."],"c":2,"r":"DAN 145, 145.107(a)(2)"},{"id":"reg72","q":"¿QUÉ CONDICIONES DEBEN CUMPLIR LOS COMPONENTES QUE SEAN EXTRAÍDOS DE AERONAVES FUERA DE VUELO PARA PODER UTILIZARSE?","o":["QUE LA AERONAVE DESDE LA CUAL SEAN EXTRAÍDOS TENGA HORAS DE VUELO DISPONIBLE.","QUE LA AERONAVE DESDE LA CUAL SEAN EXTRAÍDOS NO HAYA SUFRIDO UN ACCIDENTE.","QUE SE DEMUESTRE QUE SE ENCUENTRAN EN CONDICIÓN AERONAVEGABLE Y SU TRAZABILIDAD SEA ESTABLECIDA A TRAVÉS DEL RESPECTIVO CERTIFICADO 8130-3.","TODAS LAS ALTERNATIVAS ANTERIORES SON CORRECTAS."],"c":2,"r":"DAN 145, 145.103"},{"id":"reg73","q":"¿QUÉ DATOS DE MANTENIMIENTO APROBADOS SON CONVALIDADOS AUTOMÁTICAMENTE POR LA DGAC?","o":["TCDS - STC- DA.","AFM - SRM - FAA FORM 8110-3.","TC - STC - AD.","AD - SB - MANUALES DE OVERHAUL."],"c":3,"r":"DAN 43, 43.001, Datos aprobados (c)"},{"id":"reg74","q":"¿QUÉ DEBE CUMPLIR EL CMA PARA REALIZAR MANTENIMIENTO, EXCEPCIONALMENTE, EN UN LUGAR DISTINTO A LA UBICACIÓN APROBADA?","o":["QUE LA TAREA DE MANTENIMIENTO SE REALICE DE ACUERDO A LO ESTABLECIDO EN EL MPM.","QUE PREVIAMENTE EL CMA HAYA SOLICITADO AUTORIZACIÓN A LA DGAC PARA REALIZAR ESTO.","QUE EL MANTENIMIENTO A REALIZAR SEA UN PROCEDIMIENTO RUTINARIO PARA EL CMA.","QUE EL MANTENIMIENTO A REALIZAR SEA UN TRABAJO RUTINARIO PARA EL CMA."],"c":0,"r":"DAN 145, 145.213"},{"id":"reg75","q":"¿QUÉ DEBE CUMPLIR TODA ALTERACIÓN MAYOR?","o":["QUE ESTÉ DE ACUERDO A LA HOJA DE DATOS DEL CERTIFICADO DE TIPO (TCDS).","QUE ESTÉ DE ACUERDO A UN STC.","QUE ESTÉ DE ACUERDO A UN PROYECTO TÉCNICO DE ALTERACIÓN MAYOR.","QUE SEA EFECTUADA POR UNA OMA APROBADA O CMAE RECONOCIDO POR LA DGAC."],"c":3,"r":"DAN 43, 43.301"},{"id":"reg76","q":"¿QUÉ DEBE HACER EL CMA CUANDO EL FABRICANTE ESPECIFICA UN DETERMINADO EQUIPO O HERRAMIENTA, PARA LOS TRABAJOS DE MANTENIMIENTO?","o":["ARRENDARLOS, COMUNICANDO A LA DGAC CADA VEZ QUE LOS VA A UTILIZAR.","ARRENDARLOS, AVISANDO A LA DGAC.","UTILIZARLOS, A MENOS QUE LA DGAC AUTORICE EQUIPOS ALTERNATIVOS.","USAR EQUIPO ALTERNATIVO, SIN CONSENTIMIENTO DE LA DGAC."],"c":2,"r":"DAN 145, 145.115"},{"id":"reg77","q":"¿QUÉ DEBE IMPLEMENTAR EL CMA DAN 145 PARA UTILIZAR CARTILLAS DE TRABAJO QUE SE GENEREN POR COMPUTADORA?","o":["UN SISTEMA DE PROTECCIÓN QUE IMPIDA SU ALTERACIÓN.","UN SISTEMA QUE COPIE Y GUARDE LA INFORMACIÓN CADA 48 HORAS.","UN SISTEMA DE DISTRIBUCIÓN A TODO EL PERSONAL DE MANTENIMIENTO.","UN SISTEMA DE CONTROL REMOTO."],"c":0,"r":"DAN 145, registros/cartillas computacionales"},{"id":"reg78","q":"¿QUÉ DEBE REALIZAR UN CMA DAN 145 PARA INCLUIR UNA NUEVA HABILITACIÓN EN LA LISTA DE CAPACIDADES?","o":["ADQUIRIR LOS MANUALES, HERRAMIENTAS Y EQUIPOS NECESARIOS.","CAPACITAR AL PERSONAL QUE TRABAJARA EN LA NUEVA HABILITACIÓN.","UNA AUTOEVALUACIÓN.","TODAS LAS ALTERNATIVAS ANTERIORES SON CORRECTAS."],"c":2,"r":"DAN 145, 145.017(e)"},{"id":"reg79","q":"¿QUÉ DOCUMENTO PUEDE EMITIR LA DGAC PARA ELIMINAR UNA CONDICIÓN INSEGURA Y QUE PODRÍA DESARROLLARSE O EXISTIR EN TODOS LOS PRODUCTOS O COMPONENTES DEL MISMO DISEÑO?","o":["UNA DIRECTIVA DE AERONAVEGABILIDAD.","UN BOLETÍN DE SERVICIO.","UNA CARTA DE SERVICIO.","TODAS LAS ALTERNATIVAS ANTERIORES SON CORRECTAS."],"c":0,"r":"DAN 43, 43.001, Directiva de aeronavegabilidad"},{"id":"reg80","q":"¿QUÉ FORMULARIO SE DEBE COMPLETAR AL EFECTUAR UNA ALTERACIÓN MAYOR DE UNA AERONAVE CERTIFICADA DE TIPO?","o":["UN FORMULARIO DGAC 337 EN TRIPLICADO.","UN FORMULARIO DGAC 8130-15 EN TRIPLICADO.","EL FORMULARIO DEL SUPLEMENTO AL MANUAL DE VUELO.","LAS ALTERNATIVAS ANTERIORES A Y C SON CORRECTAS."],"c":0,"r":"DAN 43, 43.301 y 43.303"},{"id":"reg81","q":"¿QUÉ PERMITE EL CUMPLIMIENTO DE LOS REQUISITOS ESTABLECIDOS EN LA NORMA DAN 119?","o":["OBTENER UN CERTIFICADO AERONAVEGABILIDAD.","OBTENER LA ACEPTACIÓN DEL MPM POR PARTE DE LA DGAC.","OBTENER UN CERTIFICADO AOC.","OBTENER UN CERTIFICADO DE CMA."],"c":2,"r":"DAN 119, 119.001"},{"id":"reg82","q":"¿QUÉ PUEDE HACER LA DGAC SI COMPRUEBA QUE LA OPERACIÓN AUTORIZADA A UN AOC NO SE REALIZA DE ACUERDO A LO CERTIFICADO?","o":["SUSPENDER EL CERTIFICADO DE AOC.","CANCELAR EL CERTIFICADO DE AOC.","MODIFICAR EL CERTIFICADO DE AOC.","CUALQUIERA DE LAS ACCIONES SEÑALADAS EN ALTERNATIVAS ANTERIORES."],"c":3,"r":"DAN 119, 119.109"},{"id":"reg83","q":"¿QUÉ SE DEBE HACER CON UNA PARTE CON VIDA LIMITADA QUE VA A SER VENDIDA?","o":["SE DEBE MUTILAR ANTES DE SU VENTA.","SE DEBE IDENTIFICAR CON TARJETA ROJA DE CONDICIÓN “INSERVIBLE” ANTES DE SU VENTA.","SE DEBE TRANSFERIR CON LA PARTE EL REGISTRO QUE SE HAYA LLEVADO PARA SU CONTROL, A MENOS QUE LA PARTE SEA MUTILADA ANTES DE SU VENTA.","NO SE PUEDE VENDER."],"c":2,"r":"DAN 43, 43.109(c)"},{"id":"reg84","q":"¿QUÉ SE DEBE HACER CON UNA PARTE QUE HAYA ALCANZADO SU VIDA LÍMITE ESTABLECIDO EN UNA LIMITACIÓN DE AERONAVEGABILIDAD?","o":["APLICARLE UN MÉTODO QUE IMPIDA SU INSTALACIÓN, COMO POR EJEMPLO LA MUTILACIÓN.","ENVIARLO A UN CMA HABILITADO PARA SU REPARACIÓN.","ENVIARLO AL FABRICANTE PARA EFECTUARLE UN OVERHAUL.","DEJARLO EN CUARENTENA."],"c":0,"r":"DAN 43, 43.109(b)"},{"id":"reg85","q":"¿QUÉ SE DEBE REALIZAR SI AL EXISTIR UNA EVALUACIÓN “NO CUMPLE” EN UN PROCESO DE RCA, NO SE RESPONDE A LA DGAC ANTES DE 30 DÍAS CONTINUOS, LUEGO DE HABER SOLUCIONADO LAS DISCREPANCIAS QUE DIERON LUGAR A DICHA EVALUACIÓN?","o":["SE DEBE ELABORAR UNA SOLICITUD DE PRÓRROGA PARA CONTINUAR CON EL PROCESO DE RCA.","SE DEBE INFORMAR CUANDO SE HAYA SOLUCIONADO LA CONDICIÓN “NO CUMPLE” SIN LÍMITE DE TIEMPO.","SE DEBE REINICIAR EL PROCESO DE RCA.","SOLO A Y B SON CORRECTAS."],"c":2,"r":"DAP 08 06, 2.2.6(c)(1)"},{"id":"reg86","q":"¿QUÉ SE DEBE REALIZAR SI PREVIO A LA PRESENTACIÓN A RCA DE UNA AERONAVE, NO HA VOLADO EN LOS ÚLTIMOS 6 MESES?","o":["LE CORRESPONDE LA APLICACIÓN DEL PROCESO DE PRIMERA CERTIFICACIÓN DE AERONAVEGABILIDAD Y NO EL DE RCA.","EL OPERADOR DEBERÁ EFECTUAR UN VUELO DE MANTENIMIENTO DE SU RESPONSABILIDAD.","LE CORRESPONDE LA APLICACIÓN DEL PROCESO DE PRIMERA RCA.","TODAS LAS ANTERIORES SON CORRECTAS."],"c":1,"r":"DAP 08 06, 2.2.3(c)"},{"id":"reg87","q":"¿QUIÉN DEBE FIRMAR EL DOCUMENTO DE AUTO-EVALUACIÓN, CUANDO SE QUIERE INCLUIR UNA NUEVA HABILITACIÓN EN LA LISTA DE CAPACIDAD DE UN CMA DAN 145?","o":["EL GERENTE GENERAL Y EL REPRESENTANTE TÉCNICO.","EL REPRESENTANTE LEGAL.","EL INGENIERO Y EL REPRESENTANTE LEGAL.","EL DIRECTIVO RESPONSABLE Y EL DIRECTIVO DE CONTROL DE CALIDAD."],"c":3,"r":"DAN 145, 145.017(h)"},{"id":"reg88","q":"QUIEN VAYA A OPERAR UN AVIÓN CESSNA 172 EN FORMA NO COMERCIAL (USO PRIVADO), CON CERTIFICADO DE AERONAVEGABILIDAD ESTÁNDAR, DEBE CUMPLIR CON EL MANTENIMIENTO DE LA AERONAVEGABILIDAD DE TAL AERONAVE. PARA ELLO, EL OPERADOR PUEDE ELEGIR ENTRE TRES DE LAS SIGUIENTES OPCIONES. ¿CUÁL NO PUEDE ELEGIR?","o":["APLICAR UN PROGRAMA DE MANTENIMIENTO APROBADO POR LA DGAC.","APLICAR UNA INSPECCIÓN PROGRESIVA APROBADA POR LA DGAC.","APLICAR UN PROGRAMA DE MANTENIMIENTO O UNA INSPECCIÓN PROGRESIVA QUE RECOMIENDE EL FABRICANTE DE LA AERONAVE.","APLICAR LA INSPECCIÓN ANUAL ESTABLECIDA EN LA NORMA DAN 43, CADA 12 MESES O 100 HORAS DE VUELO, LO QUE SE CUMPLA PRIMERO."],"c":3,"r":"DAN 92 Vol. I, 92.603(b)"},{"id":"reg89","q":"RESPECTO A LA INSPECCIÓN ANUAL ESTABLECIDA EN EL PUNTO 43.111(B) DE LA NORMA DAN 43:","o":["QUIEN OPERE UNA AERONAVE BAJO LA NORMA DAN 92, VOL. I, LA DEBE APLICAR OBLIGATORIAMENTE A LA AERONAVE","QUIEN OPERE UNA AERONAVE BAJO LA NORMA DAN 92, VOL. I, LA PUEDE APLICAR COMO ALTERNATIVA A UN PROGRAMA DE MANTENIMIENTO APROBADO POR LA DGAC.","ES OBLIGATORIA DE APLICAR POR TODA OMA QUE EFECTÚE MANTENIMIENTO A UN AVIÓN QUE SEA OPERADO BAJO LA NORMA DAN 92, VOL. I.","NINGUNA DE LAS AFIRMACIONES ANTERIORES ES CORRECTA."],"c":1,"r":"DAN 92 Vol. I, 92.603(c)"},{"id":"reg90","q":"SEGÚN LA NORMA DAN 145 ¿QUIÉNES DEBEN TENER UNA LICENCIA DE MANTENIMIENTO?","o":["TODO EL PERSONAL DEL CMA.","EL PERSONAL DIRECTIVO, ADMINISTRATIVO Y DE EJECUCIÓN, DE INSPECCIÓN Y DE CERTIFICACIÓN DE TRABAJOS.","EL PERSONAL DE EJECUCIÓN, DE INSPECCIÓN Y DE CERTIFICACIÓN DE TRABAJOS","EL PERSONAL DEL HANGAR Y DE DESPACHO."],"c":2,"r":"DAN 145, 145.107(b)-(d)"},{"id":"reg91","q":"SEGÚN LO QUE ESTABLECE EL DAP 08 06, ¿CUÁNDO DEBERÍA SER PRESENTADO EL FORMULARIO DGAC 21/01, “SOLICITUD DE RENOVACIÓN DEL CERTIFICADO DE AERONAVEGABILIDAD”?","o":["EN CUANDO VENZA EL CERTIFICADO QUE SE ENCUENTRA VIGENTE.","A LO MENOS 30 DÍAS ANTES DE LA FECHA DE VENCIMIENTO DEL CERTIFICADO VIGENTE.","A LO MENOS DOS (2) MESES ANTES DE LA FECHA DE VENCIMIENTO DEL CERTIFICADO VIGENTE.","A LO MENOS DOS (3) MESES ANTES DE LA FECHA DE VENCIMIENTO DEL CERTIFICADO VIGENTE."],"c":2,"r":"DAP 08 06, 1.1"},{"id":"reg92","q":"SEGÚN LO QUE ESTABLECE EL DAP 08 06 RESPECTO DE “LOS ANTECEDENTES QUE EL OPERADOR ENTREGARÁ A LA DGAC COMO INFORMACIÓN BÁSICA DE LOS REGISTROS DE MANTENIMIENTO Y QUE SE ENCUENTRAN EN LA DAC 06 00 08 (I), “BITÁCORA DE MANTENIMIENTO”, ¿CUÁL DE ESTOS ANTECEDENTES NO CORRESPONDE PRESENTAR?:","o":["SITUACIÓN DE RESULTADOS DE LA ÚLTIMA VIGILANCIA CONTINUA EFECTUADA POR LA DGAC AL CMA.","SITUACIÓN ACTUALIZADA DE HORAS DE VUELO, CICLOS, PARTIDAS O ATERRIZAJES SEGÚN CORRESPONDA.","SITUACIÓN ACTUALIZADA DEL CUMPLIMIENTO DEL PROGRAMA DE INSPECCIONES O DE MANTENIMIENTO SEGÚN CORRESPONDA.","SITUACIÓN ACTUALIZADA DEL PLAN DE REEMPLAZO; SITUACIÓN ACTUALIZADA DEL CUMPLIMIENTO DE AD/DA Y, PESO Y BALANCE DE LA AERONAVE."],"c":0,"r":"DAP 08 06, 2.2.4"},{"id":"reg93","q":"SI EL SOLICITANTE DE UNA PRIMERA CERTIFICACIÓN DE AERONAVEGABILIDAD DE UNA AERONAVE PRESENTA UN CERTIFICADO DE AERONAVEGABILIDAD DE EXPORTACIÓN QUE HAGA REFERENCIA A UN TC DISTINTO AL DEL ESTADO DE DISEÑO:","o":["DEBERÁ DEMOSTRAR QUE LA AERONAVE CUMPLE CON LAS DIRECTIVAS DE AERONAVEGABILIDAD DEL ESTADO QUE EMITIÓ EL CERTIFICADO DE AERONAVEGABILIDAD DE EXPORTACIÓN Y ADEMÁS CON LAS DEL ESTADO DE DISEÑO EMISOR DEL TC.","DEBERÁ DEMOSTRAR QUE LAS DIRECTIVAS DE AERONAVEGABILIDAD DEL ESTADO QUE EMITIÓ EL CERTIFICADO DE AERONAVEGABILIDAD DE EXPORTACIÓN SON EQUIVALENTES A LAS APLICABLES DEL ESTADO DE DISEÑO EMISOR DEL TC.","SÓLO DEBERÁ DEMOSTRAR QUE LA AERONAVE CUMPLE CON LAS DIRECTIVAS DE AERONAVEGABILIDAD DEL ESTADO DE DISEÑO EMISOR DEL TC, QUE SON LAS APLICABLES.","LAS ALTERNATIVAS ANTERIORES A Y B SON CORRECTAS."],"c":2,"r":"DAN 21, Apéndice 2"},{"id":"reg94","q":"SI LA MATRÍCULA DE UNA AERONAVE ES CANCELADA POR EL REGISTRO NACIONAL DE AERONAVES (RNA), NO PUEDE SEGUIR VIGENTE SU CERTIFICADO DE AERONAVEGABILIDAD, PERO SI LA AERONAVE VUELVE A SER MATRICULADA EN EL RNA PODRÍA DE NUEVO LLEGAR A TENER UN CERTIFICADO DE AERONAVEGABILIDAD. PARA ELLO:","o":["DEBE SEGUIRSE EL PROCEDIMIENTO DAP 08 06.","DEBE SEGUIRSE EL PROCEDIMIENTO DAP 032.","DEBE SEGUIRSE EL PROCEDIMIENTO QUE SEÑALE LA NORMA DAN 21.","DEBE SEGUIRSE EL PROCEDIMIENTO QUE SEÑALE LA NORMA BAJO LA CUAL SERÁ OPERADA LA AERONAVE."],"c":2,"r":"DAN 21, Apéndice 2"},{"id":"reg95","q":"SI UNA PERSONA LE DA USO PRIVADO A SU AVIÓN CESSNA 172 Y LO OPERA BAJO LA NORMA DAN 92, VOL. I, DEBE CUMPLIR CON CIERTO MANTENIMIENTO OBLIGATORIO. ESTE MANTENIMIENTO OBLIGATORIO INCLUYE CUMPLIR CON:","o":["LAS INSTRUCCIONES DE AERONAVEGABILIDAD CONTINUADA PUBLICADAS POR EL FABRICANTE PARA EL MODELO DE AERONAVE.","EL PROGRAMA DE INSPECCIONES DEFINIDO EN EL MANUAL DE MANTENIMIENTO APLICABLE PUBLICADO POR EL FABRICANTE DE LA AERONAVE.","SI LA AERONAVE HA RESULTADO DAÑADA EN UN ACCIDENTE DE AVIACIÓN, CUMPLIR CON EL MANTENIMIENTO QUE LA DGAC APRUEBE O ACEPTE PARA RETORNARLA AL SERVICIO.","EN ESTE CASO NINGÚN MANTENIMIENTO DE LOS SEÑALADOS EN LAS ALTERNATIVAS ANTERIORES ES OBLIGATORIO."],"c":2,"r":"DAN 92 Vol. I, 92.603"},{"id":"reg96","q":"UNA ALTERACIÓN MAYOR:","o":["REQUIERE DE UN PROYECTO TÉCNICO DE ALTERACIÓN MAYOR.","REQUIERE DE UN STC.","REQUIERE DE DATOS DE MANTENIMIENTO APROBADOS.","SOLO SON CORRECTAS A Y B."],"c":2,"r":"DAN 43, 43.001"},{"id":"reg97","q":"UNA PARTE ES ELEGIBLE PARA SER INSTALADA EN UNA AERONAVE CON CERTIFICADO DE AERONAVEGABILIDAD ESTÁNDAR OTORGADO POR LA DGAC:","o":["SI CUENTA CON UN 8130-3","SI ESTÁ ESPECIFICADA EN EL IPC APLICABLE.","SÓLO SI CUENTA CON UN 8130-3.","SÓLO SI ESTÁ ESPECIFICADA EN EL IPC APLICABLE."],"c":1,"r":"DAN 43, 43.107"},{"id":"reg98","q":"UNA REPARACIÓN MAYOR DEBE REALIZARSE?","o":["DE ACUERDO AL MANUAL DE REPARACIONES ESTRUCTURALES (SRM).","DE ACUERDO A UN PROYECTO TÉCNICO DE REPARACIÓN MAYOR.","DE ACUERDO A DATOS TÉCNICOS APROBADOS O CONVALIDADOS POR LA DGAC.","TODAS LAS ALTERNATIVAS ANTERIORES SON CORRECTAS."],"c":2,"r":"DAN 43, 43.301"},{"id":"reg99","q":"UN CMA DAN 145 DEBERÁ ESTABLECER UN PROGRAMA DE CAPACITACIÓN CON EL FIN DE:","o":["QUE SU PERSONAL DE MANTENIMIENTO OBTENGA Y MANTENGA LAS COMPETENCIAS REQUERIDAS.","SU PERSONAL DE MANTENIMIENTO TENGA UNA INSTRUCCIÓN INICIAL.","SU PERSONAL DE MANTENIMIENTO TENGA UNA INSTRUCCIÓN RECURRENTE.","TODAS LAS ALTERNATIVAS SON CORRECTAS."],"c":0,"r":"DAN 145, 145.109(a)"},{"id":"reg100","q":"UN PROCESO DE SOLDADURA TIG O GTAW EN UNA PARTE DE UNA AERONAVE:","o":["DEBE SER APLICADO SÓLO DE ACUERDO A LO INDICADO EN UN MANUAL APLICABLE DEL FABRICANTE DE LA AERONAVE O EN DATOS TÉCNICOS EXPRESAMENTE APROBADOS POR LA DGAC.","SÓLO DEBE SER REALIZADO POR UNA OMA HABILITADA PARA EFECTUAR EL TIPO DE SOLDADURA.","PUEDEN SER EFECTUADOS POR UN TALLER NO HABILITADO POR LA DGAC, PERO SIEMPRE QUE LA OMA QUE LE CORRESPONDA INSTALAR LA PARTE Y EMITIR LA CONFORMIDAD DE MANTENIMIENTO DE LA AERONAVE, HAYA VERIFICADO LA CALIDAD DE LA SOLDADURA MEDIANTE INSPECCIÓN RADIOGRÁFICA.","SON CORRECTAS LAS ALTERNATIVAS A Y C ANTERIORES."],"c":0,"r":"DAN 43, 43.113(c)"}]},"ing":{"label":"Inglés Técnico","items":[{"id":"ing1","q":"ABSOLUTE PRESSURE IS EQUAL TO","o":["INSTRUMENT PRESSURE.","ATMOSPHERIC PRESSURE.","GAUGE PRESSURE PLUS ATMOSPHERIC PRESSURE.","GAUGE PRESSURE MINUS ATMOSPHERIC PRESSURE."],"c":2,"r":"FAA-H-8083-30, PAGE 3-25."},{"id":"ing2","q":"ALL METALS AND ALLOYS ARE ELECTRICALLY ACTIVE AND HAVE","o":["A SPECIFIC WEIGHT.","A SPECIFIC STRENGTH.","A SPECIFIC CORROSION RESISTANCE.","A SPECIFIC ELECTRICAL POTENTIAL."],"c":3,"r":"FAA-H-8083-30, PAGE 6-3."},{"id":"ing3","q":"ALUMINUM CORROSION RESISTANCE RANKING IS","o":["MEDIUM.","HIGH.","LOW.","ENOUGH."],"c":1,"r":"FAA - H - 8083 - 30, PAGE 5 - 6."},{"id":"ing4","q":"ARE THERE TIMES WHEN DEFINITE PRESSURE MUST BE APPLIED TO A NUT OR BOLT AS IT IS INSTALLED?","o":["NO, IN THOSE CASES SPECIAL WRENCH MAY BE USED.","YES, IN THOSE CASES TORQUE WRENCH MAY BE USED.","NO, IN THOSE CASES COMMON WRENCH MUST BE USED.","YES, IN THOSE CASES TORQUE WRENCH MUST BE USED."],"c":3,"r":"FAA-H-8083-30, PAGE 9-7."},{"id":"ing5","q":"AROUND WHAT IS AN AIRPLANE CONTROLLED IN FLIGHT?","o":["IS CONTROLLED AROUND ONE OR MORE OF THREE AXES OF ROTATION.","IS CONTROLLED AROUND MAIN AND SECUNDARY FLIGHT CONTROLS.","IS CONTROLLED FROM THE COCKPIT.","IS CONTROLLED AROUND ONE AXIS OF ROTATION AT ONE TIME."],"c":0,"r":"FAA-H-8083-30, PAGE 3-42."},{"id":"ing6","q":"ASSUMING THAT THE TEMPERATURE AND PRESSURE REMAIN THE SAME, HOW DOES THE DENSITY OF THE AIR CHANGE WITH THE HUMIDITY?","o":["DEPENDS ON THE PROPORTION.","DOES NOT VARY.","VARIES INVERSELY.","VARIES DIRECTLY."],"c":2,"r":"AC 65-15A, PAGE 29."},{"id":"ing7","q":"AT LOW SPEED, WHAT ENGINES HAVE BETTER ECONOMY?","o":["THE RECIPROCATING AND TURBOPROPELLER ENGINES HAVE BETTER ECONOMY THAN THE TURBOJET ENGINES.","THE RECIPROCATING AND TURBOJET ENGINES HAVE BETTER ECONOMY THAN THE TURBOPROPELLER ENGINES.","THE TURBOPROPELLER ENGINES HAVE BETTER ECONOMY THAN THE TURBOJET AND RECIPROCATING ENGINES.","AT LOW SPEED ALL ENGINES BURN THE SAME QUANTITY OF FUEL ."],"c":0,"r":"AC 65-12A, PAGE 3."},{"id":"ing8","q":"AT WHAT SPEED IS SAFER TO TAKEOFF AND LAND?","o":["IS SAFER TO TAKEOFF AND LAND AT LOWER AIRSPEEDS THAN AT HIGHER SPEEDS.","IS SAFER TO TAKEOFF AND LAND AT HIGHER AIRSPEEDS THAN AT LOWER SPEEDS.","THE SAFEST TAKEOFF AND LANDING SPEED DEPEND ON PILOT'S ABILITY.","THE SAFER TAKEOFF AND LANDING SPEEDS DEPEND ON THE AIRPLANE MODEL."],"c":0,"r":"FAA-H-8083-30, PAGE 4-1."},{"id":"ing9","q":"BASICALLY, WHAT ARE THE MAJOR SECTIONS OF A LARGE SINGLE-ROTOR HELICOPTER?","o":["THE ROTORS AND THE MAIN STRUCTURE.","THE TAIL CONE AND THE FUSELAGE.","THE CABIN AND THE TAIL CONE.","THE CABIN AND THE CARGO COMPARTMENT."],"c":2,"r":"AC 65-15A, PAGE 24."},{"id":"ing10","q":"BY THE USE OF WHAT IS THE MASS OF AIR ACCELERATED WITHIN THE ENGINE?","o":["BY A CONTINUOUS-FLOW CYCLE.","BY A COMPRESSOR.","BY A TURBINE.","BY TWO AXLES."],"c":0,"r":"AC 65-12A, PAGE 65."},{"id":"ing11","q":"BY THE USE OF WHAT IS THE MASS OF AIR ACCELERATED WITHIN THE ENGINE?","o":["BY A CONTINUOUS-FLOW CYCLE.","BY A COMPRESSOR.","BY A TURBINE.","BY TWO AXLES."],"c":0,"r":"AC 65-12A, PAGE 65."},{"id":"ing12","q":"BY WHAT MEANS METALS CAN BE JOINED?","o":["BY ANY MEANS LIKE BOLTING, RIVETING, WELDING, BRAZING, SOLDERING OR ADHESIVE BONDING.","BY AUTOMATIC MEANS LIKE BOLTING, RIVETING, SOLDERING MACHINE OR ADHESIVE BONDING MACHINE.","BY ELECTRICAL MEANS LIKE WELDING, BRAZING, SOLDERING OR ADHESIVE BONDING.","BY MECHANICAL MEANS LIKE BOLTING, RIVETING, WELDING, BRAZING, SOLDERING OR ADHESIVE BONDING."],"c":3,"r":"AC 65-15A, PAGE 247."},{"id":"ing13","q":"BY WHICH METHODS ARE NUTS, BOLTS, AND SCREWS SAFETY?","o":["BY THE SHORT WIRE OR LONG AND EXTRA LONG WIRE METHOD.","BY THE SINGLE WIRE FOR ELECTRICAL CONNECTORS OR DOUBLE TWIST METHOD FOR PLUG AND BOLTS.","BY THE SINGLE WIRE OR DOUBLE TWIST METHOD.","BY THE TRIPLE WIRE OR UNIQUE TWIST METHOD."],"c":2,"r":"FAA-H-8083-30, PAGE 5-80."},{"id":"ing14","q":"DURING HOVERING FLIGHT IN A NO-WIND CONDITION, HOW IS THE TIP-PATH PLANE?","o":["DEPEND ON THE PILOT SKILL.","HORIZONTAL, THIS IS VERTICAL TO THE GROUND.","VERTICAL, THIS IS PARALLEL TO THE GROUND.","HORIZONTAL, THIS IS PARALLEL TO THE GROUND."],"c":3,"r":"AC 65-15A, PAGE 50."},{"id":"ing15","q":"DURING VERTICAL FLIGHT IN A NO-WIND CONDITION, HOW DO LIFT AND THRUST FORCES ACT?","o":["VERTICALLY UPWARD.","VERTICALLY DOWNWARD.","HORIZONTALLY UPWARD.","HORIZONTALLY DOWNWARD."],"c":0,"r":"AC 65-15A, PAGE 50."},{"id":"ing16","q":"DURING VERTICAL FLIGHT IN A NO-WIND CONDITION, HOW DO LIFT AND THRUST FORCES ACT?","o":["VERTICALLY UPWARD.","VERTICALLY DOWNWARD.","HORIZONTALLY UPWARD.","HORIZONTALLY DOWNWARD."],"c":0,"r":"AC 65-15A, PAGE 50."},{"id":"ing17","q":"FROM WHAT ALLOYS ARE SOME WING PANELS FABRICATED?","o":["FROM COPPER ALLOYS.","FROM IRON ALLOYS.","FROM MAGNESIUM ALLOYS.","FROM TITANIUM ALLOYS."],"c":2,"r":"FAA-H-8083-30, PAGE 5-9."},{"id":"ing18","q":"FROM WHAT METAL ARE REAMERS MADE?","o":["THEY ARE MADE FROM EITHER VANADIUM TOOL STEEL OR HIGH-POWER STEEL.","THEY ARE MADE FROM EITHER CARBON TOOL STEEL OR HIGH-SPEED STEEL.","THEY ARE MADE FROM HARD TEMPERED STEEL.","THEY ARE MADE FROM EITHER CROMO NIQUEL VANADIUM STEEL OR LOW-SPEED STEEL."],"c":1,"r":"FAA-H-8083-30, PAGE 9-13."},{"id":"ing19","q":"HOW ARE AIRCRAFT DRAWINGS CONSIDERED?","o":["EXPENSIVE AND VALUABLE.","IMPORTANT AND SECURE.","INVALUABLE AND CHEAPER.","GOODS AND HELPFUL."],"c":0,"r":"FAA-H-8083-30, PAGE 2-2."},{"id":"ing20","q":"HOW ARE MOST HELICOPTERS STRUCTURAL MEMBERS COMPARED WITH THOSE USED IN FIXED WING AIRCRAFT?","o":["ARE VERY DIFFERENT.","ARE THE SAME.","ARE SIMILAR.","ARE IDENTICAL."],"c":2,"r":"AC 65- 15A, PAGE 24."},{"id":"ing21","q":"HOW ARE NEUMATIC SYSTEMS PROTECTED AGAINST DIRT?","o":["BY MEANS OF VARIOUS TYPES OF VALVES.","BY MEANS OF VARIOUS TYPES OF FILTERS.","BY MEANS OF VARIOUS TYPES OF PACKING AND O-RINGS.","BY MEANS OF VARIOUS TYPES OF LIQUIDS."],"c":1,"r":"AC 65-15A, PAGE 335."},{"id":"ing22","q":"HOW ARE THE CONTROL SURFACES OF SOME OLD NO TURBOJET AIRCRAFT COVERED?","o":["ARE COMPOSITE COVERED.","ARE FABRIC COVERED.","ARE FABRIC AND METAL COVERED.","ARE PLASTIC, FABRIC, METAL AND COMPOSITE COVERED."],"c":1,"r":"AC 65- 15A, PAGE 18."},{"id":"ing23","q":"HOW ARE USED IN EVERYDAY CONVERSATION THE WORDS SPEED AND VELOCITY?","o":["SPEED LIKE QUICKLY AND VELOCITY LIKE FAST.","LIKE SYNONYM.","AS IF THEY MEAN THE SAME THING.","AS THEY WERE DIFFERENT THING."],"c":2,"r":"FAA-H- 8083-30, PAGE 3-16."},{"id":"ing24","q":"HOW ARE USUALLY ATTACHED THE NONSTRUCTURAL MEMBERS THAT ARE NOT REMOVABLE FROM THE HELICOPTER?","o":["THEY ARE ATTACHED BY BOLTING OR STRUCTURAL WELDING.","THEY ARE ATTACHED BY RIVETING OR SPOT WELDING.","THEY ARE ATTACHED BY GLUEING OR SPOT WELDING.","THEY ARE ATTACHED BY SOLDERING, BOLTING, RIVETING OR ANY KIND OF WELDING."],"c":1,"r":"AC 65-15A, PAGE 25."},{"id":"ing25","q":"HOW CAN AIRCRAFT FINISH BE CLASSIFIED?","o":["DECORATIVE, PROTECTIVE AND PRESERVER.","APPEARANCE, PRIMER AND PAINT.","PROTECTIVE, ANTI-DETERIORATION AND FINISH.","PROTECTIVE, APPEARANCE AND DECORATIVE."],"c":3,"r":"AC 65-15A, PAGE 113."},{"id":"ing26","q":"HOW CAN COMPOSITES MATERIAL BE MADE?","o":["LIKE A SANDWICH STRUCTURE.","LAMINATED OR PLAIN.","WITH OR WITHOUT AN INNER CORE OF MATERIAL.","WITH OR WITHOUT AN EXTERNAL CORE OF MATERIAL"],"c":2,"r":"FAA-H-8083-30, PAGE 5-34."},{"id":"ing27","q":"HOW CAN MAGNETO IGNITION SYSTEMS BE CLASSIFIED?","o":["PRIMARY AND SECONDARY.","HIGH CURRENT AND LOW CURRENT.","HIGH IGNITION AND LOW IGNITION.","HIGH TENSION AND LOW TENSION."],"c":3,"r":"AC 65-12A, PAGE 177."},{"id":"ing28","q":"HOW DO CHANGES TAKE PLACE WITH SUPERSONIC FLOW IN VELOCITY, PRESSURE, TEMPERATURE, DENSITY AND FLOW DIRECTION?","o":["THE CHANGES TAKE PLACE SUDDENLY AND OVER A SHORT DISTANCE.","THE CHANGES TAKE PLACE SMOOTHLY AND OVER A SHORT DISTANCE.","THE CHANGES TAKE PLACE SMOOTHLY AND OVER A LONG DISTANCE.","THE CHANGES TAKE PLACE OVER ALL THE AIRFOIL."],"c":0,"r":"AC 65-15A, PAGE 59."},{"id":"ing29","q":"HOW DOES THE AIR FLOW OVER THE UPPER SURFACE OF AN AIRFOIL ACT, WHEN ITS SPEED OR VELOCITY INCREASES?","o":["THE PRESSURE INCREASES.","THE PRESSURE DECREASES.","THE AREA INCREASES.","THE VELOCITY AFFECTS THE PRESSURE."],"c":1,"r":"AC 65-15A, PAGE 29."},{"id":"ing30","q":"HOW DOES THE ENVIRONMENT AFFECT THE CONDITIONS UNDER WHICH AN AIRCRAFT IS MAINTAINED AND OPERATED?","o":["THE ENVIRONMENT AFFECTS GREATLY THE CORROSION CHARACTERISTICS.","THE ENVIRONMENT AFFECTS ONLY MINIMALLY THE CORROSION CHARACTERISTICS.","THE ENVIRONMENT DOES NOT AFFECT THE CORROSION CHARACTERISTICS.","THE SALT WATER AND NOT THE ENVIROMENT AFFECTS GREATLY THE CORROSION CHARACTERISTICS."],"c":0,"r":"FAA-H-8083-30, PAGE 6-7."},{"id":"ing31","q":"HOW DO LIQUIDS AND GASES ACT AND HOW ARE BOTH CLASSIFIED?","o":["BOTH ACT AS GASES AND ALSO ACT AS LIQUID.","BOTH ACT AS LIQUIDS AND ACT IN A VERY DISSIMILAR WAY.","BOTH ACT AS FLUIDS AND ACT IN A VERY DIFFERENT WAY.","BOTH ACT AS FLUIDS AND ACT IN A VERY SIMILAR WAY."],"c":3,"r":"FAA-H-8083- 30, PAGE 3-27."},{"id":"ing32","q":"HOW DO MOST OF THE FORCES ACT ON THE FUSELAGE OF AN AIRCRAFT WHILE IT TAKES OFF?","o":["ACTS IN THE SAME DIRECTION.","ACTS IN THE OPPOSITE DIRECTION.","ACTS INDIVIDUALLY.","THE FORCES DO NOT AFFECT THE FUSELAGE."],"c":0,"r":"AC 65-15A, PAGE 131."},{"id":"ing33","q":"HOW DO STRESSES USUALLY ACT?","o":["THEY ACT BREAKING THE PIECES THAN DO NOT HAVE RIGHT TORQUE.","THEY ACT IN A HORIZONTAL MANNER.","THEY ACT IN COMBINATION RATHER THAN SINGLY.","THEY ACT SINGLY RATHER THAN IN COMBINATION."],"c":2,"r":"AC 65-15A, PAGE 132."},{"id":"ing34","q":"HOW FREQUENTLY ARE ALUMINUM ALLOY SHEETS MARKED?","o":["EVERY FIVE INCHES OF MATERIAL.","EVERY SQUARE METER OF MATERIAL.","EVERY SQUARE FOOT OF MATERIAL.","EVERY SQUARE INCH OF MATERIAL."],"c":2,"r":"FAA-H-8083-30, PAGE 5-23."},{"id":"ing35","q":"HOW HAS THE AIRCRAFT TO BE WEIGHED WITH RESPECT TO FUEL?","o":["DEPENDS ON THE SCALE RANGE.","ONLY WITH EMPTY TANKS AND LINES.","ONLY WITH FULL FUEL IN THE TANKS AND LINES.","ONLY WITH RESIDUAL FUEL IN THE TANKS AND LINES."],"c":3,"r":"FAA-H-8083-30, PAGE 4-16."},{"id":"ing36","q":"HOW IS CALLED THE AMOUNT OF FORCE ACTING ON A SPECIFIC AMOUNT OF SURFACE AREA?","o":["POWER.","PRESSURE.","FORCE.","QUANTITY."],"c":1,"r":"FAA-H-8083-30, PAGE 3-24."},{"id":"ing37","q":"HOW IS CALLED THE BASIC BODY AND TAIL BOOM SECTIONS OF A TYPICAL HELICOPTER?","o":["MONOCOQUE.","REINFORCED.","STANDARD.","CONVENTIONAL."],"c":3,"r":"AC 65-15A, PAGE 24."},{"id":"ing38","q":"HOW IS CALLED THE GEAR WITH THE IMPUT FORCE?","o":["IS CALLED THE MAIN GEAR.","IS CALLED THE DRIVE GEAR.","IS CALLED THE DRIVEN GEAR.","IS CALLED THE FIRST CLASS GEAR."],"c":1,"r":"FAA-H-8083-30, PAGE 3-11."},{"id":"ing39","q":"HOW IS CALLED THE MOVEMENT ABOUT THE LONGITUDINAL AXIS OF AN HELICOPTER?","o":["MOVEMENT.","YAW.","PITCH.","ROLL."],"c":3,"r":"AC 65- 15A, PAGE 55."},{"id":"ing40","q":"HOW IS CALLED THE SMALLEST PARTICLE OF MATTER THAT CAN EXIST AND STILL RETAIN ITS IDENTITY?","o":["THE ATOM.","THE MOLECULE.","THE ELECTRON.","THE PROTON."],"c":1,"r":"FAA-H-8083-30, PAGE 10-1."},{"id":"ing41","q":"HOW IS CALLED THE TENDENCY OF AN OBJECT TO REMAIN STATIONARY WHEN SUPPORTED FROM ITS OWN CENTER OF GRAVITY?","o":["DYN
