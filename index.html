 ALUMINUM METALS.","CHROME-VANADIUM OR CHROMIUM-IRON METALS.","ALUMINUM OR COPPER METALS.","CHROME-NICKEL OR STAINLESS STEELS METALS."],"c":3,"r":"FAA-H-8083-30, PAGE 5-4."},{"id":"ing274","q":"WHICH ARE THE INCREMENTS OF RIVETS SHANK DIAMETERS?","o":["1/54-INCH.","1/16-INCH.","1/32-INCH.","1/64-INCH."],"c":2,"r":"FAA-H-8083-30, PAGE 5- 64."},{"id":"ing275","q":"WHICH ARE THE MAIN STRUCTURAL PARTS OF A WING?","o":["THE LEADING EDGE, THE TRAILING EDGE AND THE CHORD LINE.","THE SPARS, THE RIBS OR BULKHEADS AND THE STRINGERS OR STIFFENERS.","THE METAL SPAR SHAPES, THE SKIN AND THE STRINGERS OR STIFFENERS.","THE FLAPS, THE AILERON, THE SPEED BRAKES OR FLIGHT SPOILERS AND THE LEADING EDGES."],"c":1,"r":"AC 65-15A, PAGE 8."},{"id":"ing276","q":"WHICH ARE THE MOST WIDELY USED SEMICONDUCTOR MATERIALS?","o":["GLASS, CERAMIC AND PLASTICS.","SILICON AND GERMANIUM.","GOLD, COPPER AND SILVER.","MATERIAL WITH FREE ELECTRONS."],"c":1,"r":"FAA-H-8083-30, PAGE 10-3."},{"id":"ing277","q":"WHICH IS A DOMINANT FACTOR THAT AFFECTS THE PHYSICAL PROPERTIES OF FLUIDS?","o":["THE TEMPERATURE.","THE PRESSURE.","THE DENSITY.","THE ALTITUDE."],"c":0,"r":"FAA-H-8083-30, PAGE 3-23."},{"id":"ing278","q":"WHICH IS ONE OF THE DIFFERENCES BETWEEN A HELICOPTER AND A FIXED-WING AIRCRAFT?","o":["IS THE TYPE OF FLIGHT.","IS THE MAIN AND COCKPIT CABIN.","IS THE MAIN SOURCE OF DRAG.","IS THE MAIN SOURCE OF LIFT."],"c":3,"r":"AC 65-15A, PAGE 49."},{"id":"ing279","q":"WHICH IS THE AIRCRAFT PART THAT SUPPORTS THE AIRCRAFT DURING LANDING OR WHILE IT IS RESTING OR MOVING ABOUT ON THE GROUND?","o":["THE FIVE MAIN PARTS OF THE AIRCRAFT.","THE AIRFOIL AND THE POWER PLANTS.","THE POWER PLANTS.","THE LANDING GEAR."],"c":3,"r":"AC 65-15A, PAGE 23."},{"id":"ing280","q":"WHICH IS THE BASIC COMPONENT OF A CABLE?","o":["THE WIRE.","THE ENVELOPE.","THE METAL.","THE LINE."],"c":0,"r":"FAA-H-8083-30, PAGE 5-75."},{"id":"ing281","q":"WHICH IS THE MOST OFTEN USED LIFT-MODIFYING DEVICE, FOR SMALL AND LARGE AIRPLANE?","o":["THE WING FLAPS AND THE LEADING EDGES.","THE MAIN FLIGHT CONTROLS.","THE ENTIRE WING.","THE WING FLAPS."],"c":3,"r":"FAA-H-8083-30, PAGE 3-48."},{"id":"ing282","q":"WHICH IS THE PROPERTY OF SILICONE RUBBERS?","o":["HAVE EXCELLENT HEAT STABILITY.","REACTS FAVORABLY WITH AROMATIC GASOLINES.","IS VERY EASE TO WORK.","RESISTS THE STRIKES VERY WELL."],"c":0,"r":"FAA-H-8083-30, PAGE 5-35."},{"id":"ing283","q":"WHICH IS THE TERM APPLIED TO ALL FORMS OF GRINDING MACHINES?","o":["GRINDING WHEELS.","GRINDER.","CUTTING TOOL.","DRILL REMOVER."],"c":1,"r":"AC 65-15A, PAGE 140."},{"id":"ing284","q":"WHICH IS THE TERM APPLIED TO ALL FORMS OF GRINDING MACHINES?","o":["GRINDING WHEELS.","GRINDER.","CUTTING TOOL.","DRILL REMOVER."],"c":1,"r":"AC 65-15A, PAGE 140."},{"id":"ing285","q":"WHICH IS THE USE OF NACELLES AND OR PODS?","o":["TO HOUSE THE AUXILIARY POWER UNIT.","TO HOUSE BAGGAGE.","TO HOUSE THE ENGINES.","TO HOUSE FUEL."],"c":2,"r":"AC 65-15A, PAGE 13."},{"id":"ing286","q":"WHICH IS THE USE OF REAMERS?","o":["THEY ARE USED TO SMOOTH AND ENLARGE HOLES TO EXACT SIZE.","THEY ARE USED TO ENLARGE HOLES TO EXACT SIZE.","THEY ARE USED TO POLISH METAL BEFORE PAINTING IT.","THEY ARE USED TO FIND CORROSION AND TO TREAT IT."],"c":0,"r":"FAA-H-8083-30, PAGE 9-13."},{"id":"ing287","q":"WHICH IS USUALLY THE MOST CONVENIENT LOCATION FOR TEMPORARY BALLAST?","o":["THE BAGGAGE COMPARTMENT.","THE CABIN COMPARTMENT.","THE TAIL COMPARTMENT.","THE WING ROOT COMPARTMENT."],"c":0,"r":"FAA-H-8083-30, PAGE 4-23."},{"id":"ing288","q":"WHICH MAY BE THE PRINCIPAL REQUIREMENT IN CERTAIN STRUCTURES?","o":["THE DURABILITY.","THE STRENGTH.","THE AIRWORTHINESS.","THE STRESSES."],"c":1,"r":"AC 65-15A, PAGE 1."},{"id":"ing289","q":"WHY AIR IS CONSIDERED A FLUID?","o":["BECAUSE IS A SUBSTANCE WHICH MAY BE MADE TO FLOW OR CHANGE IT´S SHAPE BY THE APPLICATION OF MODERATE PRESSURE.","BECAUSE IT HAS WEIGHT AND VOLUME.","BECAUSE IT CAN BE USED IN BALLOON AND TIRES.","AIR IS NOT CONSIDERED A FLUID."],"c":0,"r":"AC 65-15A, PAGE 27."},{"id":"ing290","q":"WHY ARE RELIEF VALVES USED IN PNEUMATIC SYSTEMS?","o":["TO PREVENT DAMAGE.","TO PROTECT THE O-RINGS.","TO RELIEF PRESSURE.","TO MAINTAIN PRESSURE IN LIMITS."],"c":0,"r":"AC 65-15A, PAGE 334."},{"id":"ing291","q":"WHY DOES STRESS CORROSION OCCUR?","o":["STRESS CORROSION NEVER OCCURS.","STRESS CORROSION OCCURS AS THE RESULT OF MAINTAINING THE AIRPLANE DIRTY AND IN A DRY ENVIRONMENT.","STRESS CORROSION OCCURS AS THE RESULT OF KEEPING THE AIRPLANE OUT OF THE HANGAR.","STRESS CORROSION OCCURS AS THE RESULT OF THE COMBINED EFFECT OF SUSTAINED TENSILE STRESSES AND CORROSIVE ENVIRONMENT."],"c":3,"r":"FAA-H-8083-30, PAGE 6-6."},{"id":"ing292","q":"WHY DO YOU HAVE TO INSPECT THE SURROUNDING AREA DURING A STRUCTURAL DAMAGE?","o":["FOR LOST OF PAINT.","FOR RIVETS DAMAGE.","FOR EVIDENCE OF CORROSION.","FOR EVIDENCE OF BIGGEST DAMAGE."],"c":2,"r":"AC 65-15A, PAGE 127."},{"id":"ing293","q":"WHY IS ZINC CHROMATE PRIMER APPLIED TO METALLIC SURFACES?","o":["BECAUSE THE COVERING IS CORROSION RESISTANT.","BECAUSE THE COVERING HAS A NICE COLOR.","BECAUSE IT PROTECTS IT FROM THE SUN.","BECAUSE THE COVERING IS ENAMEL OR LACQUER."],"c":0,"r":"AC 65-15A, PAGE 115."},{"id":"ing294","q":"WHY THE LANDING GEAR OF MOST HIGH-SPEED OR LARGE AIRCRAFT IS RETRACTED?","o":["TO INCREASE LOAD CAPABILITY AND DECREASE VOID PLACE.","TO INCREASE WIND RESISTANCE DURING LANDING.","TO REDUCE NOISE AND TURBULENCE DURING ALL FLIGHT.","TO REDUCE WIND RESISTANCE DURING FLIGHT."],"c":3,"r":"AC 65-15A, PAGE 14."},{"id":"ing295","q":"WHY YOU MUST NEVER APPLY COMPOUND TO THE FACE OF THE FITTING OR THE FLARE?","o":["BECAUSE THE COMPOUND IS VERY CORROSIVE AND DANGEROUS.","BECAUSE ANY FLUID WILL DISSOLVE THE COMPOUND.","BECAUSE THE COMPOUND WILL DESTROY THE METAL-TO-METAL CONTACT.","BECAUSE THE COMPOUND WILL FORM A GUM WITH THE LIQUID."],"c":2,"r":"FAA-H-8083-30, PAGE 7- 13."}]}}</script>
<script>
(function(){
  "use strict";
  var DATA = JSON.parse(document.getElementById('qdata').textContent);
  var TOPIC_ORDER = ['fh','reg','ing'];
  var STORE_KEY = 'bitacora_dgac_v1';

  // ---------- grupos de estudio (repetición) ----------
  var GROUP_SIZES = { ing: [49,49,49,49,49,50] };
  function groupsFor(topicKey){
    var sizes = GROUP_SIZES[topicKey];
    if(!sizes) return null;
    var items = DATA[topicKey].items;
    var out = [], idx = 0;
    sizes.forEach(function(sz){
      out.push(items.slice(idx, idx+sz));
      idx += sz;
    });
    return out;
  }
  function groupIdsFor(topicKey, groupIdx){
    var groups = groupsFor(topicKey);
    if(!groups || groupIdx==null || !groups[groupIdx]) return null;
    return groups[groupIdx].map(function(q){ return q.id; });
  }

  function loadStore(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {history:[], missed:[]};
  }
  function saveStore(s){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){}
  }
  var store = loadStore();

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function fmtDate(ts){
    var d = new Date(ts);
    var dd = String(d.getDate()).padStart(2,'0');
    var mm = String(d.getMonth()+1).padStart(2,'0');
    return dd+'/'+mm;
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var EXAM_COUNTS = [20,50,100,'all'];

  function lastActivityFor(key){
    var items = store.history.filter(function(h){ return (h.mode==='study'||h.mode==='exam') && h.topic===key; });
    return items.length ? items[items.length-1] : null;
  }
  function bestExamFor(key){
    var items = store.history.filter(function(h){ return h.mode==='exam' && h.topic===key; });
    if(!items.length) return null;
    var best = items[0];
    items.forEach(function(h){ if(h.total && (h.correct/h.total) > (best.correct/best.total)) best = h; });
    return best;
  }
  function lastExamFor(topicKey){
    var items = store.history.filter(function(h){ return h.mode==='exam' && h.topic===topicKey; });
    return items.length ? items[items.length-1] : null;
  }
  function lastActivityForGroup(topicKey, groupIdx){
    var items = store.history.filter(function(h){ return (h.mode==='study'||h.mode==='exam') && h.topic===topicKey && h.group===groupIdx; });
    return items.length ? items[items.length-1] : null;
  }
  function bestExamForGroup(topicKey, groupIdx){
    var items = store.history.filter(function(h){ return h.mode==='exam' && h.topic===topicKey && h.group===groupIdx; });
    if(!items.length) return null;
    var best = items[0];
    items.forEach(function(h){ if(h.total && (h.correct/h.total) > (best.correct/best.total)) best = h; });
    return best;
  }
  function missedForGroupCount(topicKey, groupIdx){
    var ids = groupIdsFor(topicKey, groupIdx);
    if(!ids) return 0;
    return store.missed.filter(function(id){ return ids.indexOf(id)!==-1; }).length;
  }

  var state = { view:'home', session:null, examCount:100, examTopic:null, examGroups:[], groupsTopic:null };

  function go(view, extra){
    state.view = view;
    if(extra) Object.assign(state, extra);
    render();
    window.scrollTo(0,0);
  }

  // ---------- session builders ----------
  function startStudy(topicKey, groupIdx){
    var source = (groupIdx!=null) ? groupsFor(topicKey)[groupIdx] : DATA[topicKey].items;
    var pool = shuffle(source);
    go('session', { session:{
      mode:'study', topic:topicKey, group:(groupIdx!=null?groupIdx:null), queue:pool, idx:0, answers:[], startTime:Date.now(), answeredCurrent:false
    }});
  }
  function startExamSession(topicKey, n, groupIdxs){
    var queue;
    var groupArr = (groupIdxs && groupIdxs.length) ? groupIdxs.slice() : null;
    if(topicKey === null){
      if(n === 'all'){
        var all = [];
        TOPIC_ORDER.forEach(function(k){
          all = all.concat(DATA[k].items.map(function(q){ return Object.assign({_topic:k}, q); }));
        });
        queue = shuffle(all);
      } else {
        var per = Math.ceil(n/3);
        var picks = [];
        TOPIC_ORDER.forEach(function(k){
          picks = picks.concat(shuffle(DATA[k].items).slice(0, per).map(function(q){ return Object.assign({_topic:k}, q); }));
        });
        queue = shuffle(picks).slice(0, n);
      }
    } else {
      var source;
      if(groupArr){
        var allGroups = groupsFor(topicKey);
        source = [];
        groupArr.forEach(function(gi){ source = source.concat(allGroups[gi]); });
      } else {
        source = DATA[topicKey].items;
      }
      var pool = shuffle(source).map(function(q){ return Object.assign({_topic:topicKey}, q); });
      queue = (n === 'all') ? pool : pool.slice(0, n);
    }
    var sessGroup = (topicKey!=null && groupArr && groupArr.length===1) ? groupArr[0] : null;
    var sessGroupList = (topicKey!=null && groupArr && groupArr.length>1) ? groupArr.slice() : null;
    go('session', { session:{
      mode:'exam', topic:topicKey, group:sessGroup, groupList:sessGroupList, queue:queue, idx:0, answers:[], startTime:Date.now(), answeredCurrent:false
    }});
  }
  function startMissed(){
    var ids = store.missed.slice();
    var pool = [];
    TOPIC_ORDER.forEach(function(k){
      DATA[k].items.forEach(function(q){
        if(ids.indexOf(q.id) !== -1) pool.push(Object.assign({_topic:k}, q));
      });
    });
    pool = shuffle(pool);
    go('session', { session:{
      mode:'missed', topic:null, queue:pool, idx:0, answers:[], startTime:Date.now(), answeredCurrent:false
    }});
  }
  function startReviewSet(list){
    var pool = shuffle(list);
    go('session', { session:{
      mode:'missed', topic:null, queue:pool, idx:0, answers:[], startTime:Date.now(), answeredCurrent:false
    }});
  }

  function finishSession(){
    var s = state.session;
    var correct = s.answers.filter(function(a){return a.ok;}).length;
    var total = s.answers.length;
    var durSec = Math.round((Date.now()-s.startTime)/1000);
    var byTopic = {};
    if(s.mode !== 'study'){
      s.answers.forEach(function(a){
        var k = a.topic;
        byTopic[k] = byTopic[k] || {correct:0,total:0};
        byTopic[k].total++;
        if(a.ok) byTopic[k].correct++;
      });
    }
    var record = {
      ts: Date.now(), mode: s.mode, topic: s.topic, group:(s.group!=null?s.group:null), groups:(s.groupList?s.groupList.slice():null), total: total, correct: correct,
      durSec: durSec, byTopic: byTopic
    };
    store.history.push(record);
    if(store.history.length > 300) store.history = store.history.slice(-300);
    s.answers.forEach(function(a){
      var i = store.missed.indexOf(a.id);
      if(!a.ok){ if(i===-1) store.missed.push(a.id); }
      else { if(i!==-1 && s.mode==='missed') store.missed.splice(i,1); }
    });
    saveStore(store);
    go('result', { lastRecord: record });
  }

  // ---------- rendering ----------
  var app = document.getElementById('app');

  function render(){
    if(state.view==='home') renderHome();
    else if(state.view==='groups') renderGroups();
    else if(state.view==='session') renderSession();
    else if(state.view==='result') renderResult();
    else if(state.view==='history') renderHistory();
  }

  function topbar(title, sub, backFn){
    return '' +
    '<div class="topbar">' +
      (backFn ? '<button class="iconbtn" id="backBtn" aria-label="Volver"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>' : '') +
      '<div class="brand"><div>' +
        '<div class="mark">' + title.replace('·','<span class="dot">·</span>') + '</div>' +
        (sub ? '<div class="sub">'+sub+'</div>' : '') +
      '</div></div>' +
    '</div>';
  }

  var TOPIC_SHORT = { fh:'Fact. Humanos', reg:'Reglamentación', ing:'Inglés Técnico' };

  function renderHome(){
    var missedCount = store.missed.length;

    var html = topbar('BITÁCORA', 'DGAC · LICENCIA INGENIERO DE MANTENIMIENTO');
    html += '<main>';

    html += '<div class="panel hero-panel">' +
      '<div class="eyebrow">Cuaderno de estudio</div>' +
      '<h1 style="font-size:26px;margin-top:2px;">'+(DATA.fh.items.length+DATA.reg.items.length+DATA.ing.items.length)+' preguntas del banco DGAC</h1>' +
      '<p>Estudia por materia con retroalimentación inmediata, o rinde un simulacro con preguntas mezcladas de los tres temas. Tu historial queda guardado en este dispositivo.</p>' +
      '<div class="stat-row">' +
        '<div class="stat"><div class="n mono">'+DATA.fh.items.length+'</div><div class="l">Fact. Humanos</div></div>' +
        '<div class="stat"><div class="n mono">'+DATA.reg.items.length+'</div><div class="l">Reglamentación</div></div>' +
        '<div class="stat"><div class="n mono">'+DATA.ing.items.length+'</div><div class="l">Inglés Técnico</div></div>' +
      '</div>' +
    '</div>';

    html += '<div>' +
      '<div class="section-label"><span class="eyebrow">Estudio por materia</span><span class="rule"></span></div>' +
      '<div class="tile-grid" style="margin-top:10px;">';
    TOPIC_ORDER.forEach(function(k){
      var t = DATA[k];
      var grouped = !!GROUP_SIZES[k];
      var last = lastActivityFor(k);
      var best = bestExamFor(k);
      var cls = last ? (last.correct/last.total >= .8 ? 'on' : 'warn') : '';
      var metaExtra = grouped ? ' · en '+GROUP_SIZES[k].length+' grupos' : '';
      html += '<button class="tile '+cls+'" data-action="'+(grouped?'groups':'study')+'" data-topic="'+k+'">' +
        '<span class="led"></span>' +
        '<span class="tile-body"><h3>'+t.label+'</h3><span class="meta">'+t.items.length+' preguntas'+metaExtra+(missedForTopicCount(k) ? ' · '+missedForTopicCount(k)+' por repasar' : '')+'</span></span>' +
        '<span class="tile-score">' +
          (best ? '<div class="pct">'+Math.round(100*best.correct/best.total)+'%</div><div class="cap">mejor examen</div>' : '<div class="pct none">—</div><div class="cap">sin examen</div>') +
        '</span>' +
        '<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>' +
      '</button>';
    });
    html += '</div></div>';

    var selTopic = state.examTopic;
    var selGroups = (selTopic!=null && GROUP_SIZES[selTopic]) ? state.examGroups : [];
    var selGroupsSorted = selGroups.slice().sort(function(a,b){return a-b;});
    var selLast = lastExamFor(selTopic);
    var subtitleText = selTopic === null
      ? 'Combina las 3 materias en partes iguales'
      : (selGroups.length===1
          ? 'Preguntas solo del Grupo '+(selGroupsSorted[0]+1)+' de '+DATA[selTopic].label+', con la referencia oculta hasta responder'
          : selGroups.length>1
            ? 'Mezcla aleatoria de los Grupos '+selGroupsSorted.map(function(g){return g+1;}).join(', ')+' de '+DATA[selTopic].label+', con la referencia oculta hasta responder'
            : 'Preguntas solo de '+DATA[selTopic].label+', con la referencia oculta hasta responder');
    var startLabel = selTopic === null ? 'Iniciar simulacro' : 'Iniciar examen';

    html += '<div>' +
      '<div class="section-label"><span class="eyebrow">Simulacro / examen</span><span class="rule"></span></div>' +
      '<div class="panel" style="margin-top:10px;padding:16px;">' +
        '<div style="display:flex;justify-content:space-between;align-items:baseline;">' +
          '<h3 style="font-size:19px;">'+(selTopic===null?'Preguntas mezcladas':DATA[selTopic].label)+'</h3>' +
          (selLast ? '<span class="mono" style="font-size:13px;color:var(--muted);">último: '+selLast.correct+'/'+selLast.total+'</span>' : '') +
        '</div>' +
        '<div class="meta" style="font-size:12px;color:var(--muted);font-family:\'IBM Plex Mono\',monospace;margin-top:2px;">'+subtitleText+'</div>' +
        '<div class="field-label">Materia</div>' +
        '<div class="chip-row" id="topicChipRow">' +
          '<button class="chip '+(selTopic===null?'active':'')+'" data-topic="null">Mixto</button>' +
          TOPIC_ORDER.map(function(k){ return '<button class="chip '+(selTopic===k?'active':'')+'" data-topic="'+k+'">'+TOPIC_SHORT[k]+'</button>'; }).join('') +
        '</div>' +
        (GROUP_SIZES[selTopic] ? (
          '<div class="field-label">Grupos (elige uno o varios para mezclarlos)</div>' +
          '<div class="chip-row" id="groupChipRow">' +
            '<button class="chip '+(selGroups.length===0?'active':'')+'" data-group="null">Todos</button>' +
            GROUP_SIZES[selTopic].map(function(_,gi){ return '<button class="chip '+(selGroups.indexOf(gi)!==-1?'active':'')+'" data-group="'+gi+'">Grupo '+(gi+1)+'</button>'; }).join('') +
          '</div>'
        ) : '') +
        '<div class="field-label">Preguntas</div>' +
        '<div class="count-toggle" id="countToggle">' +
          EXAM_COUNTS.map(function(n){ return '<button data-n="'+n+'" class="'+(state.examCount===n?'active':'')+'">'+(n==='all'?'Todas':n)+'</button>'; }).join('') +
        '</div>' +
        '<button class="btn primary block" style="margin-top:14px;" data-action="exam">'+startLabel+'</button>' +
      '</div>' +
    '</div>';

    html += '<div>' +
      '<div class="section-label"><span class="eyebrow">Repaso</span><span class="rule"></span></div>' +
      '<div class="tile-grid" style="margin-top:10px;">' +
        '<button class="tile" data-action="missed" '+(missedCount===0?'disabled':'')+'>' +
          '<span class="led '+(missedCount>0?'warn':'')+'"></span>' +
          '<span class="tile-body"><h3>Preguntas falladas</h3><span class="meta">'+missedCount+' pendientes de repaso</span></span>' +
          '<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>' +
        '</button>' +
      '</div>' +
    '</div>';

    html += '<button class="btn ghost block" data-action="history">Ver historial completo</button>';

    html += '</main>';
    app.innerHTML = html;

    app.querySelectorAll('[data-action="study"]').forEach(function(b){
      b.addEventListener('click', function(){ startStudy(b.getAttribute('data-topic')); });
    });
    app.querySelectorAll('[data-action="groups"]').forEach(function(b){
      b.addEventListener('click', function(){ go('groups', { groupsTopic: b.getAttribute('data-topic') }); });
    });
    var examBtn = app.querySelector('[data-action="exam"]');
    if(examBtn) examBtn.addEventListener('click', function(){ startExamSession(state.examTopic, state.examCount, state.examGroups); });
    var missedBtn = app.querySelector('[data-action="missed"]');
    if(missedBtn) missedBtn.addEventListener('click', function(){ startMissed(); });
    var histBtn = app.querySelector('[data-action="history"]');
    if(histBtn) histBtn.addEventListener('click', function(){ go('history'); });
    var ct = document.getElementById('countToggle');
    if(ct) ct.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-n');
        state.examCount = (v === 'all') ? 'all' : parseInt(v,10);
        renderHome();
      });
    });
    var tcr = document.getElementById('topicChipRow');
    if(tcr) tcr.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-topic');
        state.examTopic = (v === 'null') ? null : v;
        state.examGroups = [];
        renderHome();
      });
    });
    var gcr = document.getElementById('groupChipRow');
    if(gcr) gcr.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        var v = b.getAttribute('data-group');
        if(v === 'null'){
          state.examGroups = [];
        } else {
          var gi = parseInt(v,10);
          var pos = state.examGroups.indexOf(gi);
          if(pos === -1) state.examGroups.push(gi);
          else state.examGroups.splice(pos,1);
        }
        renderHome();
      });
    });
  }

  function renderGroups(){
    var topicKey = state.groupsTopic;
    var t = DATA[topicKey];
    var groups = groupsFor(topicKey);

    var html = topbar((t.label).toUpperCase()+' · GRUPOS', 'Estudia de a '+Math.round(t.items.length/groups.length)+' preguntas hasta dominarlas, luego pasa al siguiente grupo', true);
    html += '<main>';
    html += '<div class="panel hero-panel">' +
      '<div class="eyebrow">Repetición por bloques</div>' +
      '<p style="margin-top:4px;">Las '+t.items.length+' preguntas de '+t.label+' están divididas en '+groups.length+' grupos, en el mismo orden del banco oficial. Elige un grupo para estudiarlo con retroalimentación inmediata (REF: siempre visible).</p>' +
    '</div>';

    html += '<div class="tile-grid" style="margin-top:14px;">';
    groups.forEach(function(g, gi){
      var last = lastActivityForGroup(topicKey, gi);
      var best = bestExamForGroup(topicKey, gi);
      var missed = missedForGroupCount(topicKey, gi);
      var cls = last ? (last.correct/last.total >= .8 ? 'on' : 'warn') : '';
      html += '<button class="tile '+cls+'" data-action="study-group" data-group="'+gi+'">' +
        '<span class="led"></span>' +
        '<span class="tile-body"><h3>Grupo '+(gi+1)+'</h3><span class="meta">'+g.length+' preguntas'+(missed ? ' · '+missed+' por repasar' : '')+'</span></span>' +
        '<span class="tile-score">' +
          (best ? '<div class="pct">'+Math.round(100*best.correct/best.total)+'%</div><div class="cap">mejor examen</div>' : '<div class="pct none">—</div><div class="cap">sin examen</div>') +
        '</span>' +
        '<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></span>' +
      '</button>';
    });
    html += '</div>';

    html += '<button class="btn ghost block" style="margin-top:16px;" data-action="study-all">Estudiar las '+t.items.length+' sin agrupar</button>';

    html += '</main>';
    app.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function(){ go('home'); });
    app.querySelectorAll('[data-action="study-group"]').forEach(function(b){
      b.addEventListener('click', function(){ startStudy(topicKey, parseInt(b.getAttribute('data-group'),10)); });
    });
    var allBtn = app.querySelector('[data-action="study-all"]');
    if(allBtn) allBtn.addEventListener('click', function(){ startStudy(topicKey); });
  }

  function missedForTopicCount(k){
    var ids = DATA[k].items.map(function(q){return q.id;});
    return store.missed.filter(function(id){ return ids.indexOf(id)!==-1; }).length;
  }

  function groupSuffix(group, groupList){
    if(groupList && groupList.length){
      return ' · Grupos ' + groupList.slice().sort(function(a,b){return a-b;}).map(function(g){return g+1;}).join(', ');
    }
    return (group!=null) ? (' · Grupo '+(group+1)) : '';
  }
  function modeLabel(mode, topic, group, groupList){
    if(mode==='study') return 'Estudio · ' + DATA[topic].label + groupSuffix(group, groupList);
    if(mode==='exam') return topic===null ? 'Simulacro mixto' : ('Examen · ' + DATA[topic].label + groupSuffix(group, groupList));
    if(mode==='missed') return 'Repaso de falladas';
    return '';
  }
  function sessionTitle(mode, topic, group, groupList){
    if(mode==='study') return DATA[topic].label + groupSuffix(group, groupList);
    if(mode==='exam') return topic===null ? 'Simulacro mixto' : ('Examen · ' + DATA[topic].label + groupSuffix(group, groupList));
    if(mode==='missed') return 'Repaso de falladas';
    return '';
  }

  function renderSession(){
    var s = state.session;
    var q = s.queue[s.idx];
    var total = s.queue.length;

    var html = topbar(sessionTitle(s.mode, s.topic, s.group, s.groupList).toUpperCase(), null, true);
    html += '<div class="progress-wrap" style="margin-top:2px;"><div class="progress-track"><div class="progress-fill" style="width:'+Math.round(100*s.idx/total)+'%"></div></div></div>';
    html += '<div class="session-meta"><span>'+(s.idx+1)+' / '+total+'</span><span id="scoreLive">'+s.answers.filter(function(a){return a.ok;}).length+' correctas</span></div>';

    html += '<main style="padding-top:12px;">';
    html += '<div class="panel qcard">';
    html += '<div class="tags">' +
      '<span class="tag">'+(q._topic ? DATA[q._topic].label.toUpperCase() : DATA[s.topic].label.toUpperCase())+'</span>' +
      (s.groupList && s.groupList.length ? '<span class="tag">GRUPOS '+s.groupList.slice().sort(function(a,b){return a-b;}).map(function(g){return g+1;}).join(', ')+'</span>' : (s.group!=null ? '<span class="tag">GRUPO '+(s.group+1)+'</span>' : '')) +
      (s.mode==='study' ? '<span class="tag">'+q.id.toUpperCase()+'</span>' : '') +
    '</div>';
    html += '<h2>'+escapeHtml(q.q)+'</h2>';
    if(q.r){
      html += '<div class="ref-line">REF: '+escapeHtml(q.r)+'</div>';
    }
    html += '<div class="options" id="optWrap">';
    ['A','B','C','D'].forEach(function(L,i){
      html += '<button class="opt" data-i="'+i+'"><span class="letter">'+L+'</span><span>'+escapeHtml(q.o[i])+'</span></button>';
    });
    html += '</div></div>';

    html += '<div class="session-footer">';
    html += '<button class="btn primary block" id="nextBtn" disabled>'+(s.idx===total-1 ? 'Finalizar' : 'Siguiente')+'</button>';
    html += '</div>';
    html += '</main>';
    app.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function(){
      if(confirm('¿Salir de esta sesión? El progreso de esta ronda no se guardará.')) go('home');
    });

    var answered = s.answeredCurrent;
    var opts = app.querySelectorAll('.opt');
    function lockOptions(chosenIdx){
      opts.forEach(function(btn, i){
        btn.disabled = true;
        if(i === q.c) btn.classList.add('correct');
        else if(i === chosenIdx) btn.classList.add('wrong');
      });
      document.getElementById('nextBtn').disabled = false;
    }
    if(answered){
      var prevAns = s.answers[s.answers.length-1];
      if(prevAns && prevAns.id === q.id) lockOptions(prevAns.chosen);
    }
    opts.forEach(function(btn){
      btn.addEventListener('click', function(){
        if(s.answeredCurrent) return;
        var i = parseInt(btn.getAttribute('data-i'),10);
        var ok = i === q.c;
        s.answers.push({ id:q.id, topic: q._topic || s.topic, chosen:i, ok:ok });
        s.answeredCurrent = true;
        lockOptions(i);
        document.getElementById('scoreLive').textContent = s.answers.filter(function(a){return a.ok;}).length+' correctas';
      });
    });
    document.getElementById('nextBtn').addEventListener('click', function(){
      if(s.idx === total-1){ finishSession(); return; }
      s.idx++; s.answeredCurrent = false;
      renderSession();
    });
  }

  function renderResult(){
    var r = state.lastRecord;
    var pct = r.total ? Math.round(100*r.correct/r.total) : 0;
    var good = pct >= 70;
    var s = state.session;

    var html = topbar('RESULTADO', modeLabel(r.mode, r.topic, r.group, r.groups).toUpperCase(), true);
    html += '<main>';
    html += '<div class="panel score-hero">' +
      '<div class="big '+(good?'good':'bad')+'">'+pct+'%</div>' +
      '<div class="frac">'+r.correct+' / '+r.total+' correctas · '+fmtTime(r.durSec)+'</div>' +
    '</div>';

    if(r.mode !== 'study' && Object.keys(r.byTopic).length > 1){
      html += '<div class="panel breakdown">';
      TOPIC_ORDER.forEach(function(k){
        var bt = r.byTopic[k];
        if(!bt) return;
        var p = bt.total ? Math.round(100*bt.correct/bt.total) : 0;
        html += '<div class="bd-row"><span class="lbl">'+DATA[k].label+'</span><span class="bd-track"><span class="bd-fill" style="width:'+p+'%"></span></span><span class="bd-num mono">'+bt.correct+'/'+bt.total+'</span></div>';
      });
      html += '</div>';
    }

    var wrong = s.answers.filter(function(a){ return !a.ok; });
    if(wrong.length){
      html += '<div class="section-label"><span class="eyebrow">Preguntas falladas ('+wrong.length+')</span><span class="rule"></span></div>';
      html += '<div class="missed-list" style="margin-top:10px;">';
      wrong.forEach(function(a){
        var topicKey = a.topic;
        var q = DATA[topicKey].items.find(function(x){return x.id===a.id;});
        if(!q) return;
        html += '<div class="missed-item">' +
          '<div class="mq">'+escapeHtml(q.q)+'</div>' +
          '<div class="ma">Correcta: '+['A','B','C','D'][q.c]+') '+escapeHtml(q.o[q.c])+'</div>' +
          (q.r ? '<div class="mr">REF: '+escapeHtml(q.r)+'</div>' : '') +
        '</div>';
      });
      html += '</div>';
    }

    html += '<div class="btn-row" style="margin-top:6px;">';
    if(wrong.length){
      html += '<button class="btn block" id="reviewWrongBtn">Repasar estas falladas</button>';
    }
    html += '<button class="btn primary block" id="homeBtn">Volver al inicio</button>';
    html += '</div>';

    html += '</main>';
    app.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function(){ go('home'); });
    document.getElementById('homeBtn').addEventListener('click', function(){ go('home'); });
    var rwBtn = document.getElementById('reviewWrongBtn');
    if(rwBtn) rwBtn.addEventListener('click', function(){
      var list = wrong.map(function(a){
        var q = DATA[a.topic].items.find(function(x){return x.id===a.id;});
        return Object.assign({_topic:a.topic}, q);
      });
      startReviewSet(list);
    });
  }

  function renderHistory(){
    var html = topbar('HISTORIAL', 'TODAS LAS SESIONES', true);
    html += '<main>';
    if(!store.history.length){
      html += '<div class="empty">Todavía no has rendido ninguna sesión.</div>';
    } else {
      html += '<div class="hist-list">';
      store.history.slice().reverse().forEach(function(h){
        var pct = h.total ? Math.round(100*h.correct/h.total) : 0;
        html += '<div class="hist-row">' +
          '<span class="hd">'+fmtDate(h.ts)+'</span>' +
          '<span class="hm"><div class="t">'+modeLabel(h.mode,h.topic,h.group,h.groups)+'</div><div class="s">'+h.total+' preguntas · '+fmtTime(h.durSec)+'</div></span>' +
          '<span class="hs" style="color:'+(pct>=70?'var(--good)':'var(--bad)')+'">'+pct+'%</span>' +
        '</div>';
      });
      html += '</div>';
      html += '<button class="btn ghost block" id="clearBtn" style="margin-top:16px;">Borrar historial y preguntas falladas</button>';
    }
    html += '</main>';
    app.innerHTML = html;
    document.getElementById('backBtn').addEventListener('click', function(){ go('home'); });
    var cb = document.getElementById('clearBtn');
    if(cb) cb.addEventListener('click', function(){
      if(confirm('Esto borrará tu historial y la lista de preguntas falladas en este dispositivo. ¿Continuar?')){
        store = {history:[], missed:[]};
        saveStore(store);
        go('home');
      }
    });
  }

  render();
})();
</script>

</body>
</html>
